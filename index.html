  const H=LAYOUT.CHART_H;
  /* #11: 전년 비교는 최근 3개 기간만 */
  const last3 = new Set(rs.slice(-3).map(r=>r.id));
  const cmp = prev ? rs.map(r=>r.id).filter(id=>last3.has(id) && prev[id]) : [];
  const mx0 = Math.max(...rs.map(r=>r.s||0), ...cmp.map(id=>prev[id].s));
  /* 선그래프: 대출액(MS팀 특정)은 금액이라 막대와 같은 좌측 축을 그대로 쓰지만,
     매출원가율은 애초에 퍼센트 값이라 막대(금액) 축을 그대로 쓰면 위치가 왜곡된다
     (예: 원가율 숫자는 커졌는데 선은 아래로 떨어져 보이는 문제) — 2026-09-14: 매출원가율은
     자기만의 퍼센트 축(mxCost)으로 따로 그리고, 그 범위를 표 오른쪽(.yax-r)에 표시한다.
     범위는 조직마다 다르게 계산하지 않고 0/50/100/150/200%로 항상 고정한다(백두 기준). */
  const lineKind = e.hasLoan ? 'loan' : (rs.some(r=>r.c!=null) ? 'cost' : null);
  const lineName = lineKind==='loan' ? '대출액' : '매출원가율';
  const isCostPct = lineKind==='cost';
  const line = rs.map(r=> lineKind==='loan' ? (r.loan!=null?r.loan:null)
                        : lineKind==='cost' ? (r.c!=null? r.c : null) : null);
  const mxCost = COST_AXIS_MAX;
  const ticks=[0,1,2,3,4];
  const cap = (isM() && e.id && YCAP[e.id]) ? YCAP[e.id] : null;
  const mx = (cap && mx0<=cap) ? cap : niceCap(mx0);
  const lineMax = isCostPct ? mxCost : mx;
  const cols=chans.map(x=>x.c), colsL=chans.map(x=>light(x.c));

  const seg=(vals,tot,cs)=> (!vals||!vals.length||tot<=0)
    ? `<span style="height:100%;background:${CO.grey}"></span>`
    : vals.map((v,i)=> v>0?`<span style="height:${(v/tot*100).toFixed(3)}%;background:${cs[i]}"></span>`:'').reverse().join('');

  const bar=(v,ch,cs,wpx,extra,cls,idx)=>`<div class="bwrap" data-cur="${idx!=null?idx:''}" style="height:${(v/mx*100).toFixed(2)}%;width:${wpx}px;${extra}">
      <b class="blab ${cls}">${n2(v)}</b><div class="stk ${cls}">${seg(ch, sum(ch)||v, cs)}</div></div>`;
  const bw = isPortrait() ? {py:40, curHas:40, curSolo:46} : {py:58, curHas:58, curSolo:62};  /* 세로일 때 막대 폭을 얇게 */
  const bars = rs.map((r,i)=>{
    const has = prev && prev[r.id] && last3.has(r.id);
    const py = has ? bar(prev[r.id].s, prev[r.id].ch, colsL, bw.py, 'grid-column:1;justify-self:end;margin-right:9px', 'py') : '';
    const cur = r.s==null ? '' : bar(r.s, r.ch, cols, has?bw.curHas:bw.curSolo, 'grid-column:2', '', i);
    return `<div class="bcol" style="flex:${has?1.6:1}" onclick="openPop(${i})" title="클릭하면 거래처별 상세">${py}${cur}</div>`;
  }).join('');

  /* 막대 폭이 균일하지 않다(전년비교 3개월은 1.6배 넓음) — 선그래프 점 위치의 "초기값"은 가중치 기준으로
     대략 잡아둔다. 다만 .bars엔 flex gap(고정 px)이 섞여 있어 이 계산만으론 정확히 안 맞을 수 있어서,
     실제 DOM에 그려진 뒤 alignLine()이 각 막대의 실측 위치로 다시 정확히 맞춘다(아래 render() 참고). */
  const n=rs.length;
  const weights = rs.map(r=> (prev && prev[r.id] && last3.has(r.id)) ? 1.6 : 1);
  const totalW = weights.reduce((a,b)=>a+b,0);
  const centers = []; let acc=0;
  for(let i=0;i<n;i++){ centers.push((acc+weights[i]/2)/totalW*100); acc+=weights[i]; }
  const pts = line.map((v,i)=> v==null?null:`${centers[i].toFixed(3)},${(100-v/lineMax*100).toFixed(3)}`).filter(Boolean).join(' ');
  /* 점 위 라벨: 위치는 금액(v) 기준 그대로, 표시 글자만 원가율(%)로 (대출액 라인은 금액 그대로).
     2026-09-14: "막대 꼭대기(매출액) 라벨과 겹치나"는 barFrac/lineFrac(서로 다른 축 기준 비율)
     비교만으론 실제 화면 겹침과 안 맞을 수 있어서(매출원가율이 자기만의 %축을 쓰게 되면서),
     일단 기본(선 위)으로 그려두고 render() 이후 adjustDotLabels()가 실제 렌더된
     .blab/.dotlab의 getBoundingClientRect()를 재서 진짜 겹칠 때만 아래로 내린다. */
  const dotLabel = (v,i) => lineKind==='cost' ? pct(rs[i].c) : n2(v);
  const dots = line.map((v,i)=> v==null?'':
    (()=>{
      const top = (100-v/lineMax*100).toFixed(3);
      return `<div class="dotpt" data-i="${i}" style="position:absolute;left:${centers[i].toFixed(3)}%;top:${top}%;
      width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
      background:#FF6A00;border:2px solid #fff"></div>
     <div class="dotlab" data-i="${i}" style="left:${centers[i].toFixed(3)}%;top:${top}%">${dotLabel(v,i)}</div>`;
    })()).join('');

  CTX = { rs, chans, prev, e };
  const visibleN = isM() ? 5 : 8;  /* 모바일 세로 기본 노출 개수: 월별=5개(최근달 포함 5개월, 그 중 뒤 3개는 전년비교), 주별=8개 */
  const widthPct = isPortrait() ? Math.round(n/visibleN*100) : 100;  /* 가로(컴퓨터)는 12개 그대로 */
  const rightAxis = isCostPct ? `<div class="yax yax-r" style="height:${H}px">${ticks.map(i=>`<span>${pct(mxCost*(4-i)/4)}</span>`).join('')}</div>` : '';
  return `<div class="plot">
    <div class="yax" style="height:${H}px">${ticks.map(i=>`<span>${n0(mx*(4-i)/4)}</span>`).join('')}</div>
    <div class="area"><div class="area-inner" style="width:${widthPct}%"><div class="canvas" style="height:${H}px">
      ${ticks.map(i=>`<div class="gl" style="top:${i/4*100}%"></div>`).join('')}
      <div class="bars">${bars}</div>
      ${lineKind?`<div class="ovl"><svg class="lnsvg" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"
        viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="#FF6A00" stroke-width="2.4"
          vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>${dots}</div>`:''}
    </div>
    <div class="xax">${rs.map((r,i)=>`<div class="${i===(curIdx!=null?curIdx:rs.length-1)?'on':''}" style="flex:${weights[i]}"><b>${labOf(r)}</b>
      ${prev&&prev[r.id]&&last3.has(r.id)?`<u>전년비 ${pct(r.s/prev[r.id].s*100)}</u>`:''}</div>`).join('')}</div>
    </div></div>
    ${rightAxis}
  </div>
  <div class="lgd">
    ${chans.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('')}
    ${lineKind?`<span><i class="ln" style="border-color:#FF6A00"></i>${lineName}</span>`:''}
  </div>`;
}

/* ══════════════════════ 막대 차트 (모바일 전용 · 가로 막대를 세로로 나열) ══════════════════════
   컴퓨터용 barChart()는 그대로 두고, 모바일에서만 이 함수를 대신 쓴다. 가로 스크롤 없이
   한 화면 폭 안에 값이 다 들어오도록, 항목을 세로로 쌓고 막대는 가로로 눕힌다. */
function barChartMobile(rs, chans, prev, e, curIdx){
  const last3 = new Set(rs.slice(-3).map(r=>r.id));
  const cmp = prev ? rs.map(r=>r.id).filter(id=>last3.has(id) && prev[id]) : [];
  const mx0 = Math.max(...rs.map(r=>r.s||0), ...cmp.map(id=>prev[id].s));
  const cap = (isM() && e.id && YCAP[e.id]) ? YCAP[e.id] : null;
  const mx = (cap && mx0<=cap) ? cap : niceCap(mx0);
  const lineKind = e.hasLoan ? 'loan' : (rs.some(r=>r.c!=null) ? 'cost' : null);
  const cols=chans.map(x=>x.c), colsL=chans.map(x=>light(x.c));

  const seg=(vals,tot,cs)=> (!vals||!vals.length||tot<=0)
    ? `<span style="width:100%;background:${CO.grey}"></span>`
    : vals.map((v,i)=> v>0?`<span style="width:${(v/tot*100).toFixed(3)}%;background:${cs[i]}"></span>`:'').join('');

  CTX = { rs, chans, prev, e };
  const rows = rs.map((r,i)=>{
    if(r.s==null) return '';
    const has = prev && prev[r.id] && last3.has(r.id);
    const wPct = (r.s/mx*100).toFixed(2);
    const py = has ? `<div class="hbar-py" style="width:${(prev[r.id].s/mx*100).toFixed(2)}%">${seg(prev[r.id].ch, sum(prev[r.id].ch)||prev[r.id].s, colsL)}</div>` : '';
    const yoy = has ? `<span class="hbar-yoy">전년비 ${pct(r.s/prev[r.id].s*100)}</span>` : '';
    const costLine = lineKind==='loan' ? `<span class="hbar-cost">대출액 ${n2(r.loan)}</span>`
                  : lineKind==='cost' && r.c!=null ? `<span class="hbar-cost">원가율 ${pct(r.c)}</span>` : '';
    return `<div class="hbar-row${i===curIdx?' on':''}" onclick="openPop(${i})">
      <div class="hbar-head"><span class="hbar-lbl">${labOf(r)}</span>${costLine}${yoy}</div>
      <div class="hbar-track-wrap">
        <div class="hbar-track" style="width:${wPct}%">${seg(r.ch, sum(r.ch)||r.s, cols)}</div>
        <span class="hbar-track-val">${n2(r.s)}</span>
      </div>
      ${py}
    </div>`;
  }).join('');

  return `<div class="hbars">${rows}</div>
  <div class="lgd">
    ${chans.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('')}
    ${prev?'<span><i style="border:1px dashed #a8b0bb;background:transparent"></i>전년(같은 기간)</span>':''}
  </div>`;
}

/* ══════════════════════ 1년 선 그래프 ══════════════════════ */
function yearLine(key, color){
  const ys = buildYear(key).filter(r=>r.s!=null);
  const H=LAYOUT.CHART_H, n=ys.length;
  const mx = niceMax(Math.max(...ys.map(r=>r.s))*1.12);
  const cv = ys.map(r=>r.c).filter(v=>v!=null);
  const hasCost = cv.length>0;
  /* 2026-09-14: barChart와 동일하게, 매출원가율은 매출액(mx) 축이 아니라 자기만의
     퍼센트 축(mxCost)으로 그린다 — 오른쪽에 그 범위를 따로 표시하고, 조직과 무관하게
     항상 0/50/100/150/200%로 고정한다. */
  const mxCost = COST_AXIS_MAX;
  const ticks=[0,1,2,3,4];
  const p1 = ys.map((r,i)=>`${(i/(n-1)*100).toFixed(3)},${(100-r.s/mx*100).toFixed(3)}`).join(' ');
  const p2 = hasCost ? ys.map((r,i)=> r.c==null?null
      :`${(i/(n-1)*100).toFixed(3)},${(100-r.c/mxCost*100).toFixed(3)}`).filter(Boolean).join(' ') : '';
  /* 매주 눈금, 라벨은 9주 간격 + 마지막 주 */
  const show = i => i%9===0 || i===n-1;
  const marks = ys.map((r,i)=>{
    const x=(i/(n-1)*100).toFixed(3);
    return `<div style="position:absolute;left:${x}%;top:0;width:1px;height:${show(i)?7:4}px;
        background:${show(i)?'#c9d0da':'#e7eaef'}"></div>` +
      (show(i)?`<div style="position:absolute;left:${x}%;top:10px;transform:translateX(-50%);
        font-size:10.5px;color:#9aa3af;font-weight:600;white-space:nowrap">${r.yr}년 ${r.w}주</div>`:'');
  }).join('');
  const visibleN = 15;  /* 모바일에서 한 화면에 보이는 주 수 — 나머지는 좌우로 스크롤해서 본다 */
  const widthPct = isPortrait() ? Math.round(n/visibleN*100) : 100;
  const rightAxis = hasCost ? `<div class="yax yax-r" style="height:${H}px">${ticks.map(i=>`<span>${pct(mxCost*(4-i)/4)}</span>`).join('')}</div>` : '';
  return `<div class="plot">
    <div class="yax" style="height:${H}px">${ticks.map(i=>`<span>${n0(mx*(4-i)/4)}</span>`).join('')}</div>
    <div class="area"><div class="area-inner" style="width:${widthPct}%"><div class="canvas" style="height:${H}px">
      ${ticks.map(i=>`<div class="gl" style="top:${i/4*100}%"></div>`).join('')}
      <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"
        viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline points="${p1}" fill="none" stroke="${color}" stroke-width="2.2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
        ${hasCost?`<polyline points="${p2}" fill="none" stroke="#C8842A" stroke-width="1.8"
          vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-dasharray="5 4"></polyline>`:''}</svg>
      ${ys.map((r,i)=>`<div title="${r.yr}년 ${r.w}주 · 매출 ${n2(r.s)}${r.c!=null?' · 매출원가율 '+pct(r.c):''}"
        style="position:absolute;left:${(i/(n-1)*100).toFixed(3)}%;top:0;bottom:0;width:${(100/n).toFixed(2)}%;
        transform:translateX(-50%)"></div>`).join('')}
    </div><div style="position:relative;height:26px;margin-top:8px">${marks}</div></div></div>
    ${rightAxis}
  </div>
  <div class="lgd"><span><i class="ln" style="border-color:${color}"></i>매출액</span>
    ${hasCost?`<span><i class="ln" style="border-color:#C8842A"></i>매출원가율</span>`:''}</div>`;
}

/* ══════════════════════ 팝업 ══════════════════════ */
/* KSUB 팀(MS팀 특정/MS팀/I팀)은 별도 prev 객체가 없고, month 배열 안에 2025년 항목이 같이 들어있다.
   같은 시트(예: 2025년-케이MS특정=S팀)에서 뽑은 전년 동월 값을 그 배열 안에서 직접 찾는다. */
function findPriorYear(e, r){
  if(!r.id.startsWith('20')) return null;   // 주별(W..)은 전년 대응값 없음
  const [y,m] = r.id.split('-');
  const pid = (parseInt(y,10)-1)+'-'+m;
  const arr = e.month || [];
  return arr.find(x=>x.id===pid) || null;
}

/* 2026-09-10: 도넛 라벨 글자폭을 문자 종류별 근사식(한글 98%, 숫자 58% 등)으로 어림
   잡았더니, 실제 렌더링 폭(특히 굵은 숫자)과 최대 24%까지 차이가 나서 라벨이 캔버스
   경계에 살짝 잘리는 문제가 있었다 — 폰트가 로딩에 실패해 대체 폰트로 렌더링되는
   환경도 있어 근사식 자체가 근본적으로 불안정하다. 화면에 보이지 않는 SVG
   <text>를 하나 만들어 실제로 그 글자를 그려보고 getComputedTextLength()로 진짜
   렌더링 폭을 재는 방식으로 바꿨다 — 어떤 폰트가 실제로 적용되든(Pretendard든
   대체 폰트든) 항상 정확하다. */
let _measureText = null;
function measureTextWidth(str, fontSize, weight){
  if(!_measureText){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('style','position:absolute;left:-99999px;top:0;width:0;height:0;overflow:hidden');
    svg.setAttribute('aria-hidden','true');
    _measureText = document.createElementNS('http://www.w3.org/2000/svg','text');
    svg.appendChild(_measureText);
    document.body.appendChild(svg);
  }
  _measureText.setAttribute('font-size', fontSize);
  _measureText.setAttribute('font-weight', weight);
  _measureText.textContent = str;
  return _measureText.getComputedTextLength();
}

/* 2026-09-09: 채널별 매출 비중을 원그래프(도넛)로 그린다. 굳이 라이브러리를 쓰지 않고
   SVG <circle>의 stroke-dasharray/offset만으로 조각을 이어 붙인다 — 원 하나를
   stroke-width만큼 굵게 그린 뒤 조각마다 (길이, 간격)을 채워서 도넛처럼 보이게 하는
   방식. rotate(-90 cx cy)로 시작점을 12시 방향으로 맞춘다(SVG 기본 시작점은
   3시 방향이라서). 가운데엔 합계 금액을 겹쳐 놓아 도넛 안이 비어 보이지 않게 한다.
   2026-09-10: 옆의 목록에만 있던 이름/매출/비중을 그래프 위에 직접 표시하는 방식으로
   바꿨다(참고 이미지 요청) — 조각의 실제 글자 폭이 그 각도에서 링 두께/호 길이 안에
   들어가면 도넛 안쪽에 바로 쓰고, 안 들어가면 도넛 밖으로 선을 그어 라벨을 붙인다.
   안쪽 글자는 이름·매출은 흰색, 비중(%)은 바깥 라벨과 같은 회색으로 고정한다.
   왼쪽/오른쪽으로 나간 바깥 라벨끼리 세로로 겹치면(채널이 많은 조직) 위에서부터
   순서대로 살짝씩 밀어낸다. */
function donutChart(vals, chans, total){
  /* 2026-09-10: 범례를 그래프 아래로 옮겨서 확보한 가로 폭만큼 원그래프를 한 번 더
     키웠다. 글자 크기(아래 insideSvg/outsideSvg의 font-size)는 그대로 두고 도형
     쪽(R/SW)만 키우면, 가운데 합계 구멍이 상대적으로 훨씬 커져서 안쪽 라벨이
     가운데 글자와 부대끼는 문제도 같이 줄어든다. */
  const R=160, SW=104;
  /* 2026-09-14: 폰트를 프리텐다드→IBM Plex Sans KR로 바꾸면서 글자 상하 여백(어센트/디센트)이
     달라져, 기존 MIN_GAP(54)로는 바깥 라벨끼리 살짝 겹치는 경우가 생겼다(실측 겹침 테스트로
     확인) — 새 폰트 기준으로 여유 있게 올렸다. */
  const OUT=R+SW/2, C=2*Math.PI*R, TAU=Math.PI*2, MIN_GAP=68;
  /* 2026-09-10: "도넛이 할당된 공간을 꽉 채우는 느낌"과 "안내선이 너무 길다"는
     피드백 — 링 바깥 여백(W)을 고정값으로 넉넉히 남기지 않고, 이번 그래프에 실제로
     필요한 만큼만(=바깥 라벨 중 가장 넓은 한 줄의 글자폭 + 안내선 길이) 남긴다.
     채널명 길이·자릿수는 매주 달라지므로 렌더링마다 다시 계산한다 — 그래야 짧은
     라벨뿐인 주엔 도넛이 더 커지고, 긴 라벨이 있는 주에도 잘리지 않는다. */
  const GAP = 22; // 링 가장자리 ~ 바깥 라벨 사이 안내선 길이(가로/세로 공통, 기존 50~52에서 단축)

  const slices=[]; let acc=0;
  chans.forEach((c,j)=>{
    const v = vals[j];
    if(!v || v<=0) return;
    slices.push({ c, v, frac: v/total, mid: (acc+v/2)/total*TAU });
    acc += v;
  });

  /* 2026-09-10: 예전엔 "비중 12% 미만"이거나 "12시/6시 극점 근처"면 무조건 바깥
     라벨로 뺐다 — 그건 링이 얇았을 때(SW=58) 맞춰둔 문턱값이라, 지금처럼 두꺼운
     링(SW=104)에서는 충분히 들어갈 조각(I팀·MS팀 등)까지 불필요하게 밀려났다.
     그래서 "이 조각의 실제 글자 폭이 이 각도에서 정말로 안 들어가는가"를 직접
     계산한다 — 12시/6시에서는 3줄 블록의 세로폭이 온전히 반지름(링 두께) 방향으로,
     3시/9시에서는 가장 넓은 줄의 가로폭이 온전히 반지름 방향으로 걸리고, 그 사이
     각도에서는 두 성분이 섞인다(sin/cos로 투영). 반지름 방향(링 두께 SW)과
     접선 방향(그 조각의 호 길이) 둘 다 여유가 있어야만 "안쪽"으로 둔다. */
  const HALF_H = 34; // 이름/매출/비중 3줄 블록 높이의 절반(IBM Plex Sans KR 기준 실측 + 여유)
  const FIT_MARGIN = 3; // 실측 폭에 더하는 최소 안전 여유(px)
  const insideHalfW = s => Math.max(
    measureTextWidth(s.c.n,15,700), measureTextWidth(n2(s.v),17,800), measureTextWidth(pct(s.frac*100),12.5,400)
  ) / 2;
  const fitsInside = s => {
    const hw = insideHalfW(s), cosA = Math.abs(Math.cos(s.mid)), sinA = Math.abs(Math.sin(s.mid));
    const radial = HALF_H*cosA + hw*sinA;      // 링 두께(SW) 방향으로 걸리는 폭
    const tangential = HALF_H*sinA + hw*cosA;  // 호 길이 방향으로 걸리는 폭
    return radial <= SW/2 - FIT_MARGIN && tangential <= (s.frac*C)/2 - FIT_MARGIN;
  };
  const inside = slices.filter(fitsInside);
  const outside = slices.filter(s=>!fitsInside(s));
  const sideOf = s => Math.sin(s.mid) < 0 ? 'L' : 'R';
  const leftArr = outside.filter(s=>sideOf(s)==='L');
  const rightArr = outside.filter(s=>sideOf(s)==='R');

  /* 바깥 라벨 3줄(이름/매출/비중) 중 가장 넓은 한 줄의 실측 폭만큼 캔버스 여백을
     남긴다. 라벨 텍스트는 안내선 끝(ax)에서 8px 더 띄운 지점(tx)부터 시작하므로
     그 8px과, 가장자리에 글자가 바싹 붙어 보이지 않도록 숨 쉴 여백(10px)을 더한다. */
  const outsideArr = leftArr.concat(rightArr);
  const maxLabelW = outsideArr.length ? Math.max(...outsideArr.map(s=>
    Math.max(measureTextWidth(s.c.n,14,700), measureTextWidth(n2(s.v),16,800), measureTextWidth(pct(s.frac*100),12,400))
  )) : 0;
  const LABEL_ALLOW = outsideArr.length ? Math.ceil(GAP + 8 + maxLabelW + 10) : 40;
  const W = Math.round(2*(OUT+LABEL_ALLOW));

  /* 채널이 많은 조직(MS팀 등)은 바깥 라벨이 한쪽에 여러 개 몰릴 수 있다 — 그만큼
     세로 공간이 필요하므로, 캔버스 높이(H)를 몰린 라벨 개수에 맞춰 늘린다. 도넛
     자체는 항상 정중앙(H/2)에 있어야 가운데 합계 오버레이가 어긋나지 않는다. */
  const maxSide = Math.max(leftArr.length, rightArr.length);
  const H = maxSide<=4 ? 520 : Math.min(980, maxSide*MIN_GAP + 260);
  const CX=W/2, CY=H/2;
  /* 2026-09-10 버그 수정: 조각이 12시/6시 극점 아주 가까이(그러나 nearPole 문턱 안쪽)에
     있으면, 바깥 라벨의 세로 위치 계산(CY ± (OUT+50))이 캔버스 위/아래 경계를 넘어가
     라벨이나 안내선이 잘려 나가거나 화면 밖으로 삐져나가 보였다(사용자가 캡처해 보내준
     "선만 있고 글자가 없는" 케이스). 라벨 한 칸(3줄, 위/아래 여백 포함) 높이만큼 항상
     안쪽 여백을 남기도록 위/아래로 clamp 한다. */
  const TOP_PAD=46, BOT_PAD=34;
  const clampY = y => Math.max(TOP_PAD, Math.min(H-BOT_PAD, y));

  let accLen=0;
  const arcs = slices.map(s=>{
    const len = s.frac*C, offset = -accLen; accLen += len;
    return `<circle r="${R}" cx="${CX}" cy="${CY}" fill="none" stroke="${s.c.c}" stroke-width="${SW}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>`;
  }).join('');

  const pt = (ang,r)=>({ x: CX+r*Math.sin(ang), y: CY-r*Math.cos(ang) });
  const layoutSide = arr=>{
    const sorted = [...arr].sort((a,b)=> -Math.cos(a.mid) - (-Math.cos(b.mid)));
    const ys = sorted.map(s=> clampY(CY + (-Math.cos(s.mid))*(OUT+GAP)));
    // 1) 위→아래로 겹침 방지: 각 라벨을 바로 위 라벨보다 MIN_GAP 이상 아래로 밀어낸다.
    for(let k=1;k<ys.length;k++){ if(ys[k]-ys[k-1] < MIN_GAP) ys[k] = ys[k-1]+MIN_GAP; }
    /* 2026-09-10 수정: 겹침 방지로 아래로 밀어내다 보면 마지막 몇 개가 아래쪽
       경계를 넘어갈 수 있다 — 예전엔 경계를 넘은 라벨을 눌러 담을 때 "바로 위
       라벨 하나만" MIN_GAP만큼 같이 끌어내렸는데, 그 라벨이 다시 그 위 라벨과
       너무 가까워지는 경우까지는 처리하지 못했다(연쇄가 한 칸에서 멈춤 — 라벨이
       많이 몰리는 주에는 이론상 두 라벨이 겹쳐 보일 수 있는 잠재 버그였다).
       그래서 "경계로 누르기"와 "MIN_GAP 연쇄 복원"을 완전히 분리된 두 단계로
       나누고, 복원 단계는 끝까지(k=0까지) 전부 훑는다. */
    for(let k=ys.length-1;k>=0;k--){ if(ys[k] > H-BOT_PAD) ys[k] = H-BOT_PAD; }
    // 3) 2)에서 눌러 담은 여파를 아래→위로 끝까지 전파해 MIN_GAP을 전부 복원한다.
    for(let k=ys.length-2;k>=0;k--){ if(ys[k+1]-ys[k] < MIN_GAP) ys[k] = ys[k+1]-MIN_GAP; }
    /* 4) 3)의 연쇄가 맨 위쪽 라벨들을 위쪽 경계 밖으로 다시 밀어냈을 가능성에 대비해
       위→아래로 한 번 더 MIN_GAP을 강제한다. H 산정 공식이 실제 데이터(최대
       11채널)에는 항상 충분한 여유를 주므로 이 단계가 실제로 값을 바꾸는 일은
       없을 것으로 예상되지만, 라벨 개수가 감당 못 할 만큼 몰리는 극단적인 경우에도
       "최소 간격은 항상 지켜진다"는 불변조건 자체는 깨지지 않도록 방어적으로 둔다. */
    for(let k=1;k<ys.length;k++){ if(ys[k]-ys[k-1] < MIN_GAP) ys[k] = ys[k-1]+MIN_GAP; }
    return sorted.map((s,k)=>({ ...s, labelY: ys[k] }));
  };
  const leftOut = layoutSide(leftArr);
  const rightOut = layoutSide(rightArr);

  const GREY = '#7a828d'; // 안쪽·바깥 라벨의 비중(%) 줄에 공통으로 쓰는 회색 — 기존 #9aa3af보다 한 단계 진하게
  const insideSvg = inside.map(s=>{
    const p = pt(s.mid, R);
    /* 2026-09-10: 배경색 대비를 계산해 밝은/어두운 텍스트를 자동으로 고르던 걸
       걷어내고, 이름·매출은 항상 흰색, 비중(%)은 바깥 라벨과 똑같은 회색으로
       고정했다 — 조각 색이 달라져도 항상 같은 톤으로 보이게. 단, 배경이 아주 옅은
       색(도소매/기타의 밝은 회색 등)인 조각은 흰 글자 대비가 약해질 수 있다.
       줄 순서는 안쪽/바깥 라벨 모두 항상 "이름 → 매출 → 비중"으로 고정한다(예전엔
       조각 위치가 중심 아래쪽이면 순서를 뒤집었는데, 라벨마다 순서가 달라 보여서
       오히려 헷갈린다는 피드백으로 되돌림). */
    const nmRow = { t: s.c.n, fs:15, fw:700, fill:'#ffffff' };
    const valRow = { t: n2(s.v), fs:17, fw:800, fill:'#ffffff' };
    const pctRow = { t: pct(s.frac*100), fs:12.5, fw:400, fill:GREY };
    const rows = [nmRow, valRow, pctRow];
    const ys = [p.y-19, p.y+3, p.y+25];
    const tspans = rows.map((r,idx)=>
      `<tspan x="${p.x.toFixed(1)}" y="${ys[idx].toFixed(1)}" font-weight="${r.fw}" font-size="${r.fs}" fill="${r.fill}">${r.t}</tspan>`
    ).join('');
    return `<text text-anchor="middle">${tspans}</text>`;
  }).join('');
  const outsideSvg = (arr, side)=> arr.map(s=>{
    const edge = pt(s.mid, OUT);
    const ax = side==='R' ? CX+OUT+GAP : CX-OUT-GAP;
    const ta = side==='R' ? 'start' : 'end';
    const tx = side==='R' ? ax+8 : ax-8;
    /* 2026-09-10: 곡선 대신 "조각 가장자리 → (한 번 꺾이는 지점) → 라벨" 순서로
       한 번만 꺾이는 직선(엘보) 안내선으로 바꿨다 — 더 또렷하고 깔끔해 보인다는
       피드백. 꺾이는 지점은 라벨과 같은 높이(labelY)에 두고, 거기서부터는 라벨
       바로 앞까지 짧은 수평 구간으로 붙인다. */
    const bendX = side==='R' ? ax-14 : ax+14;
    return `<path d="M${edge.x.toFixed(1)},${edge.y.toFixed(1)} L${bendX.toFixed(1)},${s.labelY.toFixed(1)} L${ax.toFixed(1)},${s.labelY.toFixed(1)}" fill="none" stroke="#c7ccd4" stroke-width="1.4"></path>
      <text x="${tx.toFixed(1)}" y="${(s.labelY-10).toFixed(1)}" text-anchor="${ta}" fill="#3a4049">
        <tspan x="${tx.toFixed(1)}" font-weight="700" font-size="14">${s.c.n}</tspan>
        <tspan x="${tx.toFixed(1)}" dy="18" font-weight="800" font-size="16">${n2(s.v)}</tspan>
        <tspan x="${tx.toFixed(1)}" dy="16" font-weight="400" font-size="12" fill="${GREY}">${pct(s.frac*100)}</tspan>
      </text>`;
  }).join('');

  return `<div class="mdonut" style="width:100%;max-width:${W}px;aspect-ratio:${W}/${H}">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">
      <g transform="rotate(-90 ${CX} ${CY})">${arcs}</g>
      ${outsideSvg(leftOut,'L')}${outsideSvg(rightOut,'R')}${insideSvg}
    </svg>
    <div class="mdonut-c"><span>합계</span><b>${n2(total)}</b></div>
  </div>`;
}
function openPop(i){
  if(!CTX) return;
  const {rs,chans,prev,e} = CTX, r = rs[i];
  if(!r || r.s==null) return;
  const vals = r.ch || null;
  const total = vals ? sum(vals) : 0;
  const py = (prev && prev[r.id]) || findPriorYear(e, r);
  const a = ach(r.t, r.s);

  /* #19/#20: 조직 종류별 상세 요약 줄 */
  let summary;
  if(e.hasLoan){
    const mg = r.s>0 && r.loan!=null ? (r.s-r.loan)/r.s*100 : null;
    summary = `매출액 ${n2(r.s)} · 대출액 ${n2(r.loan)} · 대익율 ${pct(mg)} · 목표 달성율 ${pct(a)}`;
  } else if(r.c!=null){
    summary = `매출액 ${n2(r.s)} · 목표 달성율 ${pct(a)} · 매출원가율 ${pct(r.c)}`;
  } else {
    summary = `매출액 ${n2(r.s)} · 목표 달성율 ${pct(a)}`;
  }
  if(py) summary += ` (전년 매출액 ${n2(py.s)})`;

  const body = (vals && total>0) ? `<div class="mbody">
      ${donutChart(vals, chans, total)}
      <div class="mlegend">${chans.map(c=>
        `<div class="mrow"><div class="nm"><i style="background:${c.c}"></i><span>${c.n}</span></div></div>`
      ).join('')}</div>
    </div>`
    : `<div class="mrow"><div class="nm"><i style="background:${CO.grey}"></i><span>미집계</span></div>
        <div class="mval"><b>${n2(r.s)}</b><u>거래처 상세 준비 중</u></div></div>`;
  document.getElementById('pop').innerHTML = `<div class="mask" onclick="closePop(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="mhd"><div><h3>${e.name} · ${labOf(r)} 거래처별 매출</h3>
        <div class="tot">${summary}</div></div>
        <button class="x" onclick="closePop()">×</button></div>
      <div style="padding:12px 0">${body}</div>
      <div class="mft"></div></div></div>`;
}
function closePop(ev){ if(ev && ev.target && !ev.target.classList.contains('mask')) return;
  document.getElementById('pop').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePop(); });

/* ══════════════════════ 표 ══════════════════════ */
function table(rs, chans, prev, e, curId, title, toggle){
  const showCost = !e.hasLoan && rs.some(r=>r.c!=null);
  const showLoan = !!e.hasLoan;
  const base = 4 + (showCost?1:0) + (showLoan?2:0);
  const head = `<tr>
    <th rowspan="2">구분</th><th rowspan="2">목표</th><th rowspan="2">매출액</th><th rowspan="2">달성율</th>
    ${showCost?'<th rowspan="2">매출원가율</th>':''}
    ${showLoan?'<th rowspan="2">대출액</th><th rowspan="2">대익률</th>':''}
    ${chans.map(x=>`<th class="g sep" colspan="3" style="color:${x.c}">${x.n}</th>`).join('')}</tr>
    <tr>${chans.map(()=>`<th class="r2 sep">목표</th><th class="r2">매출</th><th class="r2">달성율</th>`).join('')}</tr>`;

  const cells = r => chans.map((c,j)=>{
    const t = chTarget(e,j), v = r.ch?r.ch[j]:null;
    return `<td class="sep mut">${t?n0(t):'–'}</td><td>${v!=null?n2(v):'–'}</td>
            <td>${t&&v!=null?pct(ach(t,v)):'–'}</td>`;}).join('');

  let body = rs.map(r=>{
    const mg = showLoan && r.s>0 && r.loan!=null ? (r.s-r.loan)/r.s*100 : null;
    const isEst = r.est===true;
    return `<tr class="${r.id===curId?'cur':''}${isEst?' est':''}"><td>${labOf(r)}${isEst?'*':''}</td>
      <td class="mut">${n0(r.t)}</td><td class="sale">${n2(r.s)}</td><td>${pct(ach(r.t,r.s))}</td>
      ${showCost?`<td class="${r.c>=100?'hot':(r.c<70?'cool':'')}">${pct(r.c)}</td>`:''}
      ${showLoan?`<td class="mut">${n2(r.loan)}</td><td>${pct(mg)}</td>`:''}
      ${cells(r)}</tr>`;}).join('');

  const T=sum(rs.map(r=>r.t)), Sm=sum(rs.map(r=>r.s)), L=sum(rs.map(r=>r.loan));
  body += `<tr class="tot"><td>합계</td><td>${n0(T)}</td><td class="sale">${n2(Sm)}</td><td>${pct(ach(T,Sm))}</td>
    ${showCost?'<td>–</td>':''}
    ${showLoan?`<td>${n2(L)}</td><td>${pct(Sm>0?(Sm-L)/Sm*100:null)}</td>`:''}
    ${chans.map((c,j)=>{const t=e.chT?e.chT[j]/(isM()?1:52/12):null, v=sum(rs.map(r=>r.ch?r.ch[j]:0));
      return `<td class="sep">${t?n0(t):'–'}</td><td>${n2(v)}</td><td>${t?pct(ach(t,v)):'–'}</td>`;}).join('')}</tr>`;

  const p = prev && prev[curId];
  if(p){
    const colspan = 4 + (showCost?1:0) + (showLoan?2:0) + chans.length*3;
    body += `<tr class="spacer"><td colspan="${colspan}"></td></tr>`;
    body += `<tr class="py"><td>전년 ${labOf({id:curId})}</td><td>${n0(p.t)}</td>
    <td class="sale">${n2(p.s)}</td><td>${pct(ach(p.t,p.s))}</td>
    ${showCost?`<td>${pct(p.c)}</td>`:''}${showLoan?'<td>–</td><td>–</td>':''}
    ${chans.map((c,j)=>`<td class="sep">–</td><td>${p.ch?n2(p.ch[j]):'–'}</td><td>–</td>`).join('')}</tr>`;
  }

  return `<div class="card tcard"><div class="chd"><h2>${title||''}</h2>${toggle||''}</div><div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
}

/* ══════════════════════ KPI ══════════════════════ */
function kbar(rs, e, ci){
  const cur=rs[ci], pr=rs[ci-1];
  const a=ach(cur.t,cur.s), pa=pr?ach(pr.t,pr.s):null;
  /* 2026-09-16: 증가 표시색을 파랑→초록(GRN, #1F8A5B)으로 변경 — 모든 페이지 공통 요청.
     감소(DN)는 기존 그대로. */
  const UP='#1F8A5B', DN='#D64545';
  /* 퍼센트포인트 증감 표기. 2026-09-18(피드백): 화살표를 숫자 앞으로, +,- 부호는
     빼고, "%p"의 "p"도 뺀다(보담/케이/백두 페이지 공통 요청) — 전체요약 KPI 카드의
     인라인 증감(costPctDeltaInline)과 동일한 표기 규칙. */
  const dp=(c,p,note)=>{
    if(c==null||p==null||!isFinite(c)||!isFinite(p)) return note||'&nbsp;';
    const v = c-p;
    if(!isFinite(v)) return note||'&nbsp;';
    const up=v>=0;
    return `전${isM()?'월':'주'} 대비 <b style="color:${Math.abs(v)<.05?'#a8b0bb':(up?UP:DN)}">
      ${up?'▲':'▼'}${Math.abs(v).toFixed(1)}%</b>${note?'<span class="d-sep"> · </span><span class="d-note">'+note+'</span>':''}`;
  };
  /* 금액 증감 표기 (매출액 전용).
     2026-09-19(피드백 3차, F2): 퍼센트 증감(dp, 위)은 이미 화살표를 숫자 앞으로 빼고
     +,- 부호를 뺐는데, 금액 증감은 그대로(부호 접두 + 화살표가 뒤) 남아있던 것을
     같은 규칙(화살표 먼저, 부호 없이 절대값)으로 통일. */
  const damt=(c,p)=>{
    if(c==null||p==null||!isFinite(c)||!isFinite(p)) return '&nbsp;';
    const v = c-p;
    const up=v>=0;
    return `전${isM()?'월':'주'} 대비 <b style="color:${Math.abs(v)<.005?'#a8b0bb':(up?UP:DN)}">
      ${up?'▲':'▼'}${n2(Math.abs(v))}</b>`;
  };
  const cell=(l,v,dd)=>`<div class="card kc"><div class="l">${l}</div>
    <div class="v">${v}</div><div class="d">${dd}</div></div>`;

  const c1 = cell(isM()?'월간 매출액':'주간 매출액', `${n2(cur.s)}<small> 백만</small>`, damt(cur.s, pr?pr.s:null));
  const c3 = cell('목표달성율', `${a!=null?a.toFixed(1):'–'}<small>%</small>`, dp(a,pa,`목표 ${n2(cur.t)}`));

  /* 2026년 총 매출액 - month 배열 안에서 '2026-'로 시작하는 실측월을 전부 합산(월별/주별 모드와 무관한 연간 누계) */
  const y26 = (e.month||[]).filter(r=>r.id.startsWith('2026'));
  const y26s = sum(y26.map(r=>r.s)), y26t = sum(y26.map(r=>r.t));
  const cYear = cell('2026년 총 매출액', `${n2(y26s)}<small> 백만</small>`,
    `목표 대비 <b>${pct(ach(y26t,y26s))}</b>`);

  /* MS팀 특정/MS팀/I팀(KSUB)은 매출액·목표달성율·연간누계 3개만 — 대익률/매출원가율/누계매출 칸은 넣지 않는다 */
  if(!e.id) return `<div class="kbar g3">${cYear}${c1}${c3}</div>`;

  const c2 = e.hasLoan
    ? (()=>{ const m=cur.s>0?(cur.s-cur.loan)/cur.s*100:null,
                   pm=pr&&pr.s>0?(pr.s-pr.loan)/pr.s*100:null;
        return cell('대익률', `${m!=null?m.toFixed(1):'–'}<small>%</small>`,
          dp(m,pm,`대출 ${n2(cur.loan)}`)); })()
    : (cur.c!=null
        ? cell('매출원가율', `${cur.c.toFixed(1)}<small>%</small>`, dp(cur.c, pr?pr.c:null))
        : cell('누계 매출', `${n2(sum(rs.slice(0,ci+1).map(r=>r.s)))}<small> 백만</small>`,
            `목표 대비 <b>${pct(ach(sum(rs.slice(0,ci+1).map(r=>r.t)),sum(rs.slice(0,ci+1).map(r=>r.s))))}</b>`));
  return `<div class="kbar g4">${cYear}${c1}${c2}${c3}</div>`;
}

/* ══════════════════════ 렌더 ══════════════════════ */
/* KSUB 팀(MS팀 특정/MS팀/I팀)은 별도 prevM 객체가 없고, month 배열 안에 2025년 항목이 같이 들어있다.
   이걸 D.xx.prevM과 같은 모양({ '2026-08':{s,t,c,ch,...} })으로 변환해서 표/차트에 그대로 재사용한다. */
function buildKsubPrev(e){
  const out = {};
  (e.month||[]).forEach(r=>{
    if(!r.id.startsWith('20')) return;
    const [y,m] = r.id.split('-');
    if(+y>=2026) return;
    out[(+y+1)+'-'+m] = r;
  });
  return out;
}

function pageSales(){
  const e = ent(), allRs = rows();
  /* 최근 12개만 보여주되, 선택된 시점(과거로 이동한 경우 포함)이 항상 창의 마지막
     칸에 오도록 "선택 지점 기준" 창을 슬라이드한다. 예전엔 항상 "전체의 마지막 12개"로
     고정해서, 12개 창 밖의(더 과거) 주차를 선택하면 찾지 못해(ci<0) 최신 주차로
     조용히 되돌아가 버렸다 — 표/요약바가 선택과 무관하게 최신 주차에 멈춰 보이던 버그의 원인.
     전주(pr=rs[ci-1]) 비교도 이 창 안에 실제 이전 시점이 들어와야 정상 표시된다. */
  const navFloor = isM() ? MONTH_FLOOR : 0;
  const globalIdx = Math.min(Math.max(idx(), navFloor), allRs.length-1);
  /* 창의 시작점(왼쪽 끝)은 navFloor로 자르지 않는다 — 월별에서 선택 가능한 "현재 시점"은
     올해 1월 이전으로 못 가지만, 그 시점의 트레일링 12개월 창 자체는 작년 데이터까지
     정상적으로 보여줘야 한다(예: 올해 1월 선택 시 작년 2월~올해 1월 12개가 나와야 함). */
  const rs = allRs.slice(Math.max(0, globalIdx-11), globalIdx+1);
  const selId = allRs[globalIdx].id;
  let ci = rs.findIndex(r=>r.id===selId);
  if(ci<0) ci = rs.length-1;
  const safeCI = ci;
  /* 2026-09-09: 월별 "막대그래프"만 별도로 — 선택한 달이 3월보다 이른(1~2월) 경우에도
     그래프 창(rs) 자체는 3월에서 멈춰 두고, 그 안에서 실제 선택된 달의 막대만 굵게
     표시한다(barCI). 표/KPI 요약(kbarHtml)은 계속 원래 rs/ci(선택한 달 그대로)를 쓴다 —
     "그래프 모양은 그대로, 요약 내용만 해당 월로 바뀐다"는 요구사항. */
  let barRs = rs, barCI = safeCI;
  if(isM()){
    const barWindowEnd = Math.min(Math.max(globalIdx, MONTH_CHART_FLOOR), allRs.length-1);
    if(barWindowEnd !== globalIdx){
      barRs = allRs.slice(Math.max(0, barWindowEnd-11), barWindowEnd+1);
      barCI = barRs.findIndex(r=>r.id===selId);
      if(barCI<0) barCI = barRs.length-1;
    }
  }
  const isKsub = S.nav2==='kp' && S.ksub!=='all';
  const prev = isKsub ? (isM()?buildKsubPrev(e):null) : (isM()?D[S.nav2].prevM:D[S.nav2].prevW);
  const chartKey = (S.nav2==='kp' && S.ksub!=='all') ? S.ksub : S.nav2;
  /* "1년 흐름"(yearLine) 라인 뷰는 법인 3사(D.bo/bd/kp)만 지원한다 — buildYear()가 D에서만
     읽으므로, 월별이거나 케이프라이드 소분류(MS팀 특정/MS팀/I팀)일 땐 막대로 안전하게 되돌린다. */
  const view = ((isM() || isKsub) && S.view==='line') ? 'bar' : S.view;
  const showLine = !isM() && !isKsub;

  const kbarHtml = kbar(rs, e, ci);
  const viewToggle = `<div class="seg sm">${(showLine?[['bar','막대'],['line','라인'],['table','표']]:[['bar','막대'],['table','표']])
      .map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="setView('${x[0]}')">${x[1]}</button>`).join('')}</div>`;

  let bodyHtml;
  if(view==='table'){
    /* 2026-09-09: 화면의 주별 표는 원래대로 전체 이력(fullWeeks)을 다 보여준다.
       PDF_EXPORT_MODE일 때만(예전 조직별 일괄 PDF 저장 시절 요청) 막대그래프와 똑같이
       최근 12주(트레일링 윈도우, rs)로 맞춘다 — 2026-09-16 현재는 PDF 저장이 전체요약
       전용(exportSummaryPdf)으로 바뀌어 이 분기가 실제로 타는 경로는 없지만, 조직별
       화면 자체의 정상 동작(항상 false→fullWeeks)에는 영향이 없어 그대로 둔다. */
    const weekTableRs = PDF_EXPORT_MODE ? rs : fullWeeks(e);
    bodyHtml = table(isM()?rs:weekTableRs, e.chans, prev, e, ci>=0?rs[ci].id:rs[rs.length-1].id, `${e.name} ${isM()?'월별':'주별'} 표`, viewToggle);
  } else if(view==='line'){
    bodyHtml = `<div class="card chart">
      <div class="chd"><h2>${e.name} 1년 흐름</h2>${viewToggle}</div>
      ${yearLine(chartKey, e.color)}
    </div>`;
  } else {
    /* 모바일(세로)에서는 가로 스크롤 막대 대신, 세로로 쌓인 가로 막대 리스트를 쓴다. */
    const chartHtml = isPortrait() ? barChartMobile(barRs, e.chans, prev, e, barCI) : barChart(barRs, e.chans, prev, e, barCI);
    bodyHtml = `<div class="card chart">
      <div class="chd"><h2>${e.name} ${isM()?'월별':'주별'}</h2>${viewToggle}</div>
      ${chartHtml}
    </div>`;
  }
  return { kbarHtml, bodyHtml };
}

/* ══════════════════════ 전체 요약 화면 ══════════════════════
   2026-09-15: 최근 시점(월/주 각각 최신)만 훑어보는 용도라 스테퍼/PDF/월별·주별 토글이
   없고, 대신 돈가 박스를 둔다. 조직별 스테퍼 상태(S.mi/S.wi)와 무관하게 항상 각
   엔티티의 month/week 배열 "마지막" 항목(=readCutoff 기준 최신)만 본다. */
const SUMMARY_ENTITIES = () => [D.bo, D.kp, KSUB.ms_t, KSUB.ms, KSUB.it, D.bd];
/* 2026-09-16: 케이프라이드/MS팀 특정/MS팀/I팀은 모두 케이프라이드 소속이므로, 전체 요약
   화면의 표 머리말 색상은 넷 다 케이프라이드 주황색으로 통일한다(각 엔티티 고유 브랜드색
   자체는 그대로 두고, 이 표 헤더 색만 별도로 매핑). */
function sumHeaderColor(entity){
  if(entity===D.kp || entity===KSUB.ms_t || entity===KSUB.ms || entity===KSUB.it) return D.kp.color;
  return entity.color;
}

/* 2026-09-18(피드백): "전월대비/전주대비" 별도 줄 대신, 화살표+%p를 월/주 값 바로
   뒤에 붙인다. 사용자 요청대로 화살표가 숫자보다 앞에 오고, +,- 부호는 쓰지 않는다
   (증가/감소는 화살표(▲/▼)와 색으로만 구분). ±0.05%p 미만은 회색으로 처리하는 기존
   규칙(kbar()의 dp() 헬퍼)은 그대로 따른다. */
function costPctDeltaInline(curC, prevC){
  if(curC==null || prevC==null || !isFinite(curC) || !isFinite(prevC)) return '';
  const v = curC - prevC;
  const up = v>=0;
  const color = Math.abs(v)<.05 ? '#a8b0bb' : (up ? '#1F8A5B' : '#D64545');
  return `<b class="kc-sum-delta" style="color:${color}">${up?'▲':'▼'}${Math.abs(v).toFixed(1)}%</b>`;
}
/* 2026-09-18(피드백): 카드 세 번째 줄 — "매출액 · 달성율"을 월(좌)/주(우)로 나눠서
   보여준다. kbar()의 c1/c3(월간·주간 매출액/목표달성율)과 같은 데이터(r.s/r.t, ach())를
   그대로 쓴다. */
function costSalesSubText(row){
  if(!row) return '매출액 – · 달성율 –';
  const a = ach(row.t, row.s);
  return `매출액 ${n2(row.s)} · 달성율 ${a!=null?a.toFixed(1)+'%':'–'}`;
}
/* 2026-09-18(피드백 3차): "두 개의 상자"(item5)는 테두리 있는 박스 UI가 아니라
   "월 값끼리, 주 값끼리 묶어서 생각해달라"는 뜻이었다 — 사용자가 다시 보낸 참고
   사진대로, 원가율+증감 줄과 매출액·달성율 줄을 각각 하나의 줄로 두고 월(좌)/주(우)로
   나누는 원래 레이아웃으로 되돌렸다. 카드 위쪽 법인 브랜드색 테두리(border-top)와
   "이름"만 쓰는 제목은 그대로 유지. */
function summaryCostCard(id){
  const e = D[id];
  const mArr = e.month||[], wArr = e.week||[];
  const mLast = mArr[mArr.length-1], mPrev = mArr[mArr.length-2];
  const wLast = wArr[wArr.length-1], wPrev = wArr[wArr.length-2];
  const mc = mLast && mLast.c!=null ? mLast.c.toFixed(1) : '–';
  const wc = wLast && wLast.c!=null ? wLast.c.toFixed(1) : '–';
  return `<div class="card kc-sum" style="border-top:3px solid ${e.color}">
    <div class="l">${e.name}</div>
    <div class="kc-sum-row">
      <div class="kc-sum-item">
        <div class="kc-sum-main"><span class="u">월</span><b>${mc}<small>%</small></b>${costPctDeltaInline(mLast&&mLast.c, mPrev&&mPrev.c)}</div>
        <div class="hp-delta">${costSalesSubText(mLast)}</div>
      </div>
      <div class="kc-sum-div"></div>
      <div class="kc-sum-item">
        <div class="kc-sum-main"><span class="u">주</span><b>${wc}<small>%</small></b>${costPctDeltaInline(wLast&&wLast.c, wPrev&&wPrev.c)}</div>
        <div class="hp-delta">${costSalesSubText(wLast)}</div>
      </div>
    </div>
  </div>`;
}

/* 거래처(채널)별 전월/금월(또는 전주/금주) 매출액 + 증감 — 증감은 감소=붉은색, 증가=푸른색 */
function sumTable(entity, prevRow, curRow, unitLabel){
  const chans = entity.chans;
  const dcell = (pv,cv) => {
    if(pv==null || cv==null) return `<td class="dcell">–</td>`;
    const diff = cv-pv;
    const cls = diff<0 ? 'dn' : (diff>0 ? 'up' : '');
    return `<td class="dcell ${cls}">${diff>=0?'+':''}${n2(diff)}</td>`;
  };
  const rows = chans.map((c,j)=>{
    const pv = prevRow && prevRow.ch ? prevRow.ch[j] : null;
    const cv = curRow && curRow.ch ? curRow.ch[j] : null;
    return `<tr><td class="nm">${c.n}</td><td>${pv!=null?n2(pv):'–'}</td><td>${cv!=null?n2(cv):'–'}</td>${dcell(pv,cv)}</tr>`;
  }).join('');
  const pT = prevRow?prevRow.s:null, cT = curRow?curRow.s:null;
  const totRow = `<tr class="tot"><td>매출 총액</td><td>${pT!=null?n2(pT):'–'}</td><td>${cT!=null?n2(cT):'–'}</td>${dcell(pT,cT)}</tr>`;
  /* 기존 표(.tw table)용 전역 th{background:#fafbfc}가 특정도 더 높은 요소별 배경이라
     <tr style="background">만으론 안 먹힌다(th 자체가 불투명) — th 각각에 직접 건다. */
  const thStyle = `style="background:${sumHeaderColor(entity)}"`;
  return `<table><thead><tr>
      <th ${thStyle}>구분</th><th ${thStyle}>전${unitLabel}</th><th ${thStyle}>금${unitLabel}</th><th ${thStyle}>전${unitLabel}대비</th></tr></thead>
    <tbody>${rows}${totRow}</tbody></table>`;
}

/* 간이 막대그래프 — 기존 barChart()와 같은 채널 색상을 쓰되, 전년비교/목표선 없이
   최근 5개 기간만 보여준다(월별이면 5개월, 주별이면 5주).
   2026-09-16: item2(왼쪽 값 축)·item3(매출원가율/대출액 꺾은선) 추가 — 메인 대시보드의
   barChart()와 같은 방식(왼쪽=금액축, 원가율은 자기만의 %축을 오른쪽에 별도 표시,
   고정범위 0/50/100/150/200%)을 그대로 따른다. 다만 여기는 막대 폭이 전부 동일해서
   메인처럼 폭 가중치 계산은 필요 없고, 점의 가로 위치만 alignSummaryLines()가 실측으로
   보정한다(세로 위치는 .sc-bars/.sc-ovl의 padding을 맞춰뒀기 때문에 %계산만으로 정확하다). */
function sumChart(entity, win){
  const chans = entity.chans;
  const mx = Math.max(1, ...win.map(r=>r.s||0));
  const n = win.length || 1;
  const lineKind = entity.hasLoan ? 'loan' : (win.some(r=>r.c!=null) ? 'cost' : null);
  const lineName = lineKind==='loan' ? '대출액' : '매출원가율';
  const isCostPct = lineKind==='cost';
  const mxCost = COST_AXIS_MAX;
  const lineMax = isCostPct ? mxCost : mx;
  const line = win.map(r=> lineKind==='loan' ? (r.loan!=null?r.loan:null)
                        : lineKind==='cost' ? (r.c!=null? r.c : null) : null);
  const ticks=[0,1,2,3,4];

  const bars = win.map((r,i)=>{
    const h = (r.s||0)/mx*100;
    const tot = sum(r.ch||[]) || r.s || 1;
    const segs = (r.ch||[]).map((v,j)=> v>0?`<span style="height:${(v/tot*100).toFixed(2)}%;background:${chans[j].c}"></span>`:'').reverse().join('');
    return `<div class="sc-col"><div class="sc-bar" data-cur="${i}" style="height:${h.toFixed(2)}%">
      <b class="sc-lab">${n2(r.s)}</b><div class="sc-stk">${segs}</div></div></div>`;
  }).join('');

  const dotLabel = (v,i) => lineKind==='cost' ? pct(win[i].c) : n2(v);
  const dots = line.map((v,i)=> v==null?'':(()=>{
    const top = (100-v/lineMax*100).toFixed(3);
    const left = ((i+.5)/n*100).toFixed(3); /* 초기값 — alignSummaryLines()가 실제 막대 중심으로 다시 맞춘다 */
    return `<div class="sc-dotpt" data-i="${i}" style="position:absolute;left:${left}%;top:${top}%;
      width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#FF6A00;border:2px solid #fff"></div>
     <div class="sc-dotlab" data-i="${i}" style="left:${left}%;top:${top}%">${dotLabel(v,i)}</div>`;
  })()).join('');
  const initPts = line.map((v,i)=> v==null?null:`${((i+.5)/n*100).toFixed(3)},${(100-v/lineMax*100).toFixed(3)}`).filter(Boolean).join(' ');

  const leftAxis = `<div class="sc-yax">${ticks.map(i=>`<span>${n0(mx*(4-i)/4)}</span>`).join('')}</div>`;
  const rightAxis = isCostPct ? `<div class="sc-yax sc-yax-r">${ticks.map(i=>`<span>${pct(mxCost*(4-i)/4)}</span>`).join('')}</div>` : '';
  const xax = win.map(r=>`<div>${labOf(r)}</div>`).join('');
  /* 2026-09-17(item6): .sc-xax를 .sc-grid의 2번째 열(=.sc-plot과 같은 열)에 두는 grid
     레이아웃으로 바꿨다 — 자세한 이유는 위 .sc-grid CSS 주석 참고. */
  return `<div class="sc">
    <div class="sc-grid">
      ${leftAxis}
      <div class="sc-plot">
        <div class="sc-bars">${bars}</div>
        ${lineKind?`<div class="sc-ovl"><svg class="sc-lnsvg" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"
          viewBox="0 0 100 100" preserveAspectRatio="none">
          <polyline points="${initPts}" fill="none" stroke="#FF6A00" stroke-width="2"
            vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>${dots}</div>`:''}
      </div>
      ${rightAxis}
      <div class="sc-xax">${xax}</div>
    </div>
    <div class="sc-lgd">${chans.map(c=>`<span><i style="background:${c.c}"></i>${c.n}</span>`).join('')}
      ${lineKind?`<span><i class="ln" style="border-color:#FF6A00"></i>${lineName}</span>`:''}
    </div>
  </div>`;
}

/* 2026-09-18(피드백 2차, item6): 엔티티 하나당 카드 하나 — 그 안에 월/주 두 블록을
   나란히 둔다("보담 월,주가 한 카드"). 예전엔 이 함수가 월 또는 주 "한쪽만" 받아서
   호출부(buildSummaryScreen 등)가 월 전용 컬럼/주 전용 컬럼을 따로 만들고, 같은
   엔티티가 카드 2장으로 쪼개져 있었다 — 이제 month/week를 한 번에 받아 카드 하나로
   합친다. */
function summaryPeriodBlock(entity, rs, unitLabel){
  const win = (rs||[]).slice(-5);
  const cur = rs && rs.length ? rs[rs.length-1] : null;
  const prev = rs && rs.length>1 ? rs[rs.length-2] : null;
  return `<div class="sumsec-period">
    <div class="sumsec-period-h">${unitLabel}</div>
    <div class="sumsec-body">
      <div class="sumtable">${sumTable(entity, prev, cur, unitLabel)}</div>
      <div class="sumchart">${sumChart(entity, win)}</div>
    </div>
  </div>`;
}
function summarySection(entity){
  return `<div class="sumsec">
    <div class="sumsec-h">${entity.name}</div>
    <div class="sumsec-periods">
      ${summaryPeriodBlock(entity, entity.month, '월')}
      <div class="sumsec-pdivider"></div>
      ${summaryPeriodBlock(entity, entity.week, '주')}
    </div>
  </div>`;
}

/* 2026-09-18(피드백): 돈가(가격/전주대비) 문자열 조립을 한 곳으로 모았다 — 웹 상단바
   (.hogprice)와 PDF 제목줄(.sumtitle-hp) 양쪽에서 그대로 재사용한다. 전주대비 표기는
   화살표가 숫자 앞, +,- 부호 없음(다른 상단요약 증감과 동일한 규칙, 웹/PDF 모두 적용). */
function hogPriceParts(){
  const hp = window.__DASH_HOGPRICE__ || {price:null, wow:null};
  const priceStr = hp.price!=null ? hp.price.toLocaleString('ko-KR')+'원' : '–';
  const wowUp = hp.wow!=null && hp.wow>=0;
  const wowColor = hp.wow==null ? '#a8b0bb' : (wowUp ? '#1F8A5B' : '#D64545');
  const wowStr = hp.wow!=null ? `${wowUp?'▲':'▼'}${Math.abs(hp.wow).toLocaleString('ko-KR')}` : '–';
  return {priceStr, wowStr, wowColor};
}
/* 2026-09-17(item2): "9월"/"37주차" 제목 줄 — 상단 KPI 카드(kbar-sum)가 다루는 게 바로
   이 월/주차 데이터이므로, 그 정보의 기준이 되는 제목이 KPI 카드보다 위에 오는 게 맞다는
   피드백으로 전용 함수로 뺐다. 화면(buildSummaryScreen)과 PDF(buildSummaryPdfPage)가
   똑같이 이 함수 하나를 쓴다.
   2026-09-18(item3): grid(1fr 1fr auto)로 바꾸면서 두 컬럼폭을 맞추던 투명 스페이서
   (.sumtitle-spacer)가 더 이상 필요 없어져서 마크업에서 뺐다 — grid의 column-gap이
   같은 역할을 한다.
   2026-09-18(item3·4, PDF 전용): withHogPrice가 true면(=PDF 1페이지) 돈가를 KPI
   카드에서 빼서 이 줄의 3번째(맨 끝) 칸(.sumtitle-hp)에 붙인다 — 웹 화면은 기존처럼
   상단바에 돈가가 그대로 있으므로 호출부에서 인자를 넘기지 않는다. */
function summaryTitleRow(withHogPrice){
  const cutoff = window.__DASH_CUTOFF__;
  const monthBig = cutoff ? `${cutoff.month}월` : '';
  const weekBig = cutoff ? `${cutoff.week}주차` : '';
  let hpHtml = '';
  if(withHogPrice){
    const {priceStr, wowStr, wowColor} = hogPriceParts();
    hpHtml = `<div class="sumtitle-hp">
      <div class="hp-box">돈가 <b>${priceStr}</b></div>
      <div class="hp-delta">전주대비 <b style="color:${wowColor}">${wowStr}</b></div>
    </div>`;
  }
  return `<div class="sumtitlerow">
    <div class="sumcol-h">${monthBig}</div>
    <div class="sumcol-h">${weekBig}</div>
    ${hpHtml}
  </div>`;
}

/* 2026-09-18(피드백 2차, item4): "전체 요약 페이지도 PDF와 동일하게 상단요약부분과
   월,주차 위치를 바꿔달라"는 요청 — PDF(buildSummaryPdfPage)가 지난 라운드에 KPI
   카드를 제목줄보다 위로 올린 것과 똑같이, 화면도 kbar-sum을 summaryTitleRow()보다
   먼저 놓는다. 돈가는 이 화면에서는 그대로 상단바(.hogprice)에 있고 위치를 옮기지
   않는다 — 요청이 "상단요약부분/월·주차 순서"였을 뿐 돈가 언급은 없었다. */
function buildSummaryScreen(g, navHtml){
  const {priceStr, wowStr, wowColor} = hogPriceParts();

  const sections = SUMMARY_ENTITIES().map(e=>summarySection(e)).join('');

  return `
  <div class="fixed-zone">
  <div class="top top-summary">
    <div class="brand"><div class="bar" style="background:#15181d"></div>
      <h1>${g.n}</h1>
      <span class="unit">(단위:백만 원)</span></div>
    <div class="hogprice">
      <button class="pdfbtn" id="pdfBtn" onclick="exportSummaryPdf()" title="전체 요약을 인쇄용 3페이지 PDF로 저장">
        <span class="pdfico"></span>PDF 저장</button>
      <div class="hp-delta">전주대비 <b style="color:${wowColor}">${wowStr}</b></div>
      <div class="hp-box">돈가 <b>${priceStr}</b></div>
    </div>
  </div>
  ${navHtml}
  <div class="kbar kbar-sum">${['bo','kp','bd'].map(id=>summaryCostCard(id)).join('')}</div>
  ${summaryTitleRow()}
  </div>
  <div class="sumcard"><div class="sumscroll"><div class="sumwrap">
    ${sections}
  </div></div></div>`;
}

/* 2026-09-09: render()가 만들던 화면 HTML을 buildScreenHtml()로 분리했다 — 조직별
   화면(보담/케이프라이드/백두)과 전체요약 화면이 이 함수 하나를 공유한다.
   2026-09-16: 전체요약 PDF 저장(exportSummaryPdf)은 이 함수를 쓰지 않고 별도의
   buildSummaryPdfPage()(브랜드바/내비 없는 인쇄용 레이아웃)를 쓴다 — 다만 표/차트
   자체(summarySection/sumTable/sumChart)는 화면과 PDF가 그대로 공유한다. */
function buildScreenHtml(){
  /* 세로(모바일)/가로 여부에 맞는 카드·캔버스 높이를 먼저 확정해 둔다 — 이 값이 아래
     pageSales()의 barChart/table에서 인라인 px로 그대로 쓰이므로, HTML을 만들기 전인
     지금 반드시 먼저 계산해야 한다. */
  recalcCardLayout(isPortrait());
  const g = NAV.find(x=>x.id===S.nav1);
  if(g.subs.length && !g.subs.some(x=>x.id===S.nav2)) S.nav2 = g.subs[0].id;

  /* 2026-09-15: nav1 렌더링은 '전체 요약'(가짜 엔티티, D['summary'] 없음) 탭이 생기면서
     일반 조직 페이지와 요약 페이지 양쪽에서 똑같이 써야 해서 별도로 뺐다. */
  const navHtml = `<div class="nav1">${g.subs.map(x=>{
     const col = x.id==='summary' ? '#15181d' : D[x.id].color;
     const btn = `<button class="${S.nav2===x.id?'on':''}" onclick="go2('${x.id}')"
       style="${S.nav2===x.id?`background:${col};border-color:${col}`:''}">
       <span class="pip" style="background:${S.nav2===x.id?'#fff':col}"></span>${x.n}</button>`;
     if(x.id!=='kp') return btn;
     const drop = KP_SUBS.map(([kv,kn])=>{
       const on = S.nav2==='kp' && S.ksub===kv;
       return `<button class="${on?'on':''}" onclick="selectKp('${kv}')">${kn}</button>`;
     }).join('');
     return `<div class="nav1-kp-wrap">${btn}<div class="kp-drop">${drop}</div></div>`;
   }).join('')}</div>`;

  if(S.nav2==='summary') return buildSummaryScreen(g, navHtml);

  const e = ent();
  const rs = rows();
  const navFloor = isM() ? MONTH_FLOOR : 0;
  const i = Math.min(Math.max(idx(), navFloor), rs.length-1);
  const r = rs[i];
  const big = isM() ? `${r.id.slice(0,4)}년 ${+r.id.slice(5)}월` : `2026년 ${r.id.slice(1)}주차`;

  const page = pageSales();

  return `
  <div class="fixed-zone">
  <div class="top">
    <div class="brand"><div class="bar" style="background:${e.color}"></div>
      <h1>${g.n}</h1>
      <span class="unit">(단위:백만 원)</span></div>
    <div class="topright">
      <div class="seg"><button class="${isM()?'on':''}" onclick="setMode('month')">월별</button>
        <button class="${!isM()?'on':''}" onclick="setMode('week')">주별</button></div>
      <div class="stepper">
        <button onclick="step(-1)" ${i<=navFloor?'disabled':''}>‹</button>
        <div class="lbl">${big}</div>
        <button onclick="step(1)" ${i>=rs.length-1?'disabled':''}>›</button></div>
    </div>
  </div>
  <!-- 2026-09-14: 보담/백두/케이프라이드는 최상단 카테고리 위치에 그대로 있고, 케이프라이드
       선택 시에만 있던 전사/MS팀 특정/MS팀/I팀 소분류는 이제 별도 줄(navrow) 대신
       케이프라이드 탭에 마우스를 올리면 펼쳐지는 드롭다운으로 옮겼다 — 그 줄이 없어진
       만큼의 세로 공간은 아래 상단요약(kbar)이 넘겨받는다. -->
  ${navHtml}
  ${S.nav2==='kp'?`<div class="mob-ksub"><div class="seg sm">${KP_SUBS
      .map(x=>`<button class="${S.ksub===x[0]?'on':''}" onclick="setKsub('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`:''}
  ${page.kbarHtml}
  </div>
  ${page.bodyHtml}`;
}
function render(){
  document.getElementById('stage').innerHTML = buildScreenHtml();
  fit();
  /* 표는 최근 구간(6개월/6주)이 먼저 보이도록 표 내부 스크롤은 기본적으로 맨 아래로 맞춘다.
     2026-09-14: 표 글씨·행을 크게 키우면서 "그냥 맨 아래(scrollHeight)"로 맞추면 총 내용
     높이가 행 높이의 정배수가 아닐 때 맨 위 행이 sticky 헤더에 반쯤 가려 잘려 보이는
     문제가 두드러졌다 — 실제 행 경계(각 tr의 top)에 맞춰, 헤더 바로 아래에 어떤 행의
     "윗변"이 정확히 오도록(잘린 행 없이) 맨 아래에 가장 가까운 위치로 스냅한다. */
  /* 2026-09-14: "몇 줄이 보이는가"는 컨테이너 높이에 우연히 맞는 만큼이 아니라, 항상
     정확히 TABLE_VISIBLE_ROWS줄(머리말 제외)이 되도록 "뒤에서 N번째 행"의 윗변에 맞춰
     스크롤한다 — 폰트 렌더링이 환경마다 미묘하게 달라도 항상 같은 줄 수가 보인다.
     spacer(전년행 앞의 얇은 구분용 빈 행)는 실제 "줄"로 세지 않는다 — 주별은 데이터
     N주+합계, 월별은 데이터 N개월+합계+전년동월이 그 N줄 안에 들어오게 하기 위함. */
  const twEl = document.querySelector('.tw');
  if(twEl){
    const table = twEl.querySelector('table');
    const thead = table && table.querySelector('thead');
    const theadH = thead ? thead.offsetHeight : 0;
    const maxScroll = twEl.scrollHeight - twEl.clientHeight;
    let target = maxScroll;
    if(table){
      const rows = Array.from(table.querySelectorAll('tbody tr')).filter(tr=>!tr.classList.contains('spacer'));
      const topRow = rows.length > TABLE_VISIBLE_ROWS ? rows[rows.length-TABLE_VISIBLE_ROWS] : rows[0];
      if(topRow) target = Math.min(Math.max(topRow.offsetTop - theadH, 0), maxScroll);
    }
    twEl.scrollTop = target;
  }
  /* 막대그래프도 처음엔 가장 최근(오른쪽 끝)이 보이도록 */
  const areaEl = document.querySelector('.area');
  if(areaEl) areaEl.scrollLeft = areaEl.scrollWidth;
  alignLine();
  adjustDotLabels();
  alignSummaryLines();
  adjustSummaryDotLabels();
}
/* 무대를 화면에 맞춰 축소 */
/* 가로 볼 때는 기존 339:191 그대로. 세로(모바일 세로)일 때만 기기별(아이폰/갤럭시) 화면비로 --H를 바꾼다.
   너비(--W=1920)는 항상 그대로 두고, 세로에서 --H만 그 비율에 맞게 늘려서 계산한다. */
/* "화면이 세로로 길쭉한가"만 보면 컴퓨터에서 창을 좁게/세로로 만든 경우까지 모바일로 오인한다.
   그래서 "실제 모바일 기기인지"까지 같이 확인한다 — 컴퓨터는 창 모양이 어떻든 이 조건에 절대 안 걸린다. */
const IS_MOBILE_DEVICE = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
/* 2026-09-09: PDF 저장(exportSummaryPdf) 중에는 실제 기기가 모바일/세로여도 항상
   데스크탑 레이아웃(가로 막대그래프 등)으로 캡처해야 인쇄용 PDF가 일관되게 나온다.
   isPortrait()를 호출하는 모든 곳(barChart 폭 계산 등 포함)에 한 번에 적용되도록
   전역 플래그로 강제한다. */
let FORCE_DESKTOP_EXPORT = false;
/* 2026-09-09: PDF에서만 주별 표를 최근 12주(막대그래프와 동일한 트레일링 창)로 제한하기
   위한 플래그. 화면에서는 계속 전체 이력을 보여준다(pageSales() 참고). */
let PDF_EXPORT_MODE = false;
/* fit()이 render() "이후"에 실행되므로, render() 도중(barChart 등)에도 즉시 같은 기준으로 판정할 수 있도록 별도 함수로 뺀다 */
function isPortrait(){ return !FORCE_DESKTOP_EXPORT && IS_MOBILE_DEVICE && window.innerWidth < window.innerHeight; }
/* 선그래프(원가율/대출액) 점·점라벨·꺾은선을 "실제로 그려진 올해 막대"의 픽셀 중심에 다시 맞춘다.
   .bars엔 flex gap(고정 px)이 섞여 있어서 %만으로 계산하면 오차가 누적된다 — 실측이 가장 정확하다. */
function alignLine(root){
  root = root || document;
  const svg = root.querySelector('.lnsvg'); if(!svg) return;
  const canvas = svg.closest('.canvas'); if(!canvas) return;
  const cvRect = canvas.getBoundingClientRect();
  if(cvRect.width<=0) return;
  const poly = svg.querySelector('polyline');
  const pts = [];
  root.querySelectorAll('.dotpt[data-i]').forEach(dot=>{
    const i = dot.getAttribute('data-i');
    const bar = canvas.querySelector(`.bwrap[data-cur="${i}"]`);
    if(!bar) return;
    const bRect = bar.getBoundingClientRect();
    const xPct = ((bRect.left + bRect.width/2) - cvRect.left) / cvRect.width * 100;
    dot.style.left = xPct.toFixed(3)+'%';
    const lab = root.querySelector(`.dotlab[data-i="${i}"]`);
    if(lab) lab.style.left = xPct.toFixed(3)+'%';
    pts.push([+i, xPct, dot.style.top]);
  });
  if(poly && pts.length){
    pts.sort((a,b)=>a[0]-b[0]);
    poly.setAttribute('points', pts.map(p=>`${p[1].toFixed(3)},${parseFloat(p[2]).toFixed(3)}`).join(' '));
  }
}
/* 선(매출원가율/대출액) 점 라벨이 같은 막대의 매출액 라벨(.blab)과 실제로 겹치면 아래로 내린다.
   alignLine()과 같은 이유로 %계산이 아니라 실제 렌더된 DOM 사각형(getBoundingClientRect)을 잰다 —
   원가율이 자기만의 축을 쓰게 되면서 "막대높이비율-선높이비율" 같은 간접 계산은 실제 화면 겹침과
   안 맞을 수 있어서다. 매 render()마다 위치가 바뀌므로 항상 기본(선 위)으로 되돌린 뒤 다시 잰다. */
function adjustDotLabels(root){
  root = root || document;
  const hit=(a,b)=> !(a.right<b.left || a.left>b.right || a.bottom<b.top || a.top>b.bottom);
  root.querySelectorAll('.dotlab[data-i]').forEach(lab=>{
    lab.style.transform = ''; lab.style.marginTop = '';
    const i = lab.getAttribute('data-i');
    const canvas = lab.closest('.canvas');
    const bar = canvas && canvas.querySelector(`.bwrap[data-cur="${i}"]`);
    const blab = bar && bar.querySelector('.blab');
    if(!blab) return;
    const br = blab.getBoundingClientRect();
    if(!hit(lab.getBoundingClientRect(), br)) return;
    /* 1차: 선 위 대신 아래로 */
    lab.style.transform = 'translate(-50%,30%)';
    let lr = lab.getBoundingClientRect();
    if(!hit(lr, br)) return;
    /* 2차: 막대(짧은 막대 등)와 원가율 점이 거의 같은 높이라 아래로 내려도 여전히 겹치면,
       매출액 라벨(.blab) 아래로 확실히 빠져나갈 만큼 실측한 만큼만 추가로 내린다. */
    const extra = (br.bottom - lr.top) + 4;
    if(extra > 0) lab.style.marginTop = extra + 'px';
  });
}
/* 2026-09-16: 전체 요약 화면의 간이 차트(sumChart)용 — alignLine()과 똑같은 이유(막대 사이
   고정 px gap 때문에 %계산만으론 오차가 생김)로, 실제 렌더된 막대(.sc-bar) 중심을 재서
   선/점의 가로 위치를 다시 맞춘다. 세로 위치는 .sc-bars/.sc-ovl의 padding을 맞춰뒀기
   때문에 보정이 필요 없다. 요약 화면이 아닌 페이지에는 .sc-lnsvg가 없으므로 그냥 아무 일도
   하지 않는다. */
function alignSummaryLines(root){
  root = root || document;
  root.querySelectorAll('.sc-lnsvg').forEach(svg=>{
    const plot = svg.closest('.sc-plot'); if(!plot) return;
    const svgRect = svg.getBoundingClientRect();
    if(svgRect.width<=0) return;
    const poly = svg.querySelector('polyline');
    const pts = [];
    plot.querySelectorAll('.sc-dotpt[data-i]').forEach(dot=>{
      const i = dot.getAttribute('data-i');
      const bar = plot.querySelector(`.sc-bar[data-cur="${i}"]`);
      if(!bar) return;
      const bRect = bar.getBoundingClientRect();
      const xPct = ((bRect.left + bRect.width/2) - svgRect.left) / svgRect.width * 100;
      dot.style.left = xPct.toFixed(3)+'%';
      const lab = plot.querySelector(`.sc-dotlab[data-i="${i}"]`);
      if(lab) lab.style.left = xPct.toFixed(3)+'%';
      pts.push([+i, xPct, dot.style.top]);
    });
    if(poly && pts.length){
      pts.sort((a,b)=>a[0]-b[0]);
      poly.setAttribute('points', pts.map(p=>`${p[1].toFixed(3)},${parseFloat(p[2]).toFixed(3)}`).join(' '));
    }
  });
}
/* adjustDotLabels()와 같은 로직을 sumChart의 .sc-dotlab/.sc-lab 쌍에 적용 */

/* 모바일(세로): 축소 없이 실제 화면 폭 그대로, 세로로 자연스럽게 스크롤되는 레이아웃.
   데스크탑(가로): 기존 그대로 1920×1082 무대를 화면에 맞게 축소해서 보여준다. */
function fit(){
  const st=document.getElementById('stage'); if(!st) return;
  const vp=document.getElementById('viewport');
  const portrait = isPortrait();
  document.documentElement.classList.toggle('mob', portrait);
  document.body.classList.toggle('mob', portrait);
  vp.classList.toggle('mob', portrait);
  st.classList.toggle('portrait', portrait);
  recalcCardLayout(portrait);
  if(portrait){
    st.style.transform='none';
    return;
  }
  applyLayout();
  const W = LAYOUT.STAGE_W, H = LAYOUT.STAGE_H;
  document.documentElement.style.setProperty('--W', W+'px');
  document.documentElement.style.setProperty('--H', H+'px');
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  st.style.transform='scale('+s+')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);

   그런데 이건 창 크기가 바뀐 게 아니라서 resize 이벤트가 안 뜬다. 폰트 로딩 완료
   (document.fonts.ready)와 전체 리소스 로딩 완료(load) 시점에도 한 번 더 fit()을 불러

/* ══════════════════════ PDF 저장(전체 요약, exportSummaryPdf) ══════════════════════
   2026-09-16: 예전엔 각 조직 화면(보담/백두/케이프라이드)마다 PDF 저장 버튼이 있어서
   화면 그대로(월별·주별×막대·표 24장)를 통째로 내보냈는데, 이제 그 버튼들은 없애고
   전체 요약 화면 하나에만 PDF 버튼을 둔다 — 대신 이 버튼이 만드는 PDF는 "화면 그대로"가
   아니라 사용자가 준 참고 사진과 똑같은 별도의 인쇄용 3페이지 레이아웃이다:
     1페이지 = 보담+백두 (상단에 매출원가율 3장 + 돈가 1장, 총 4장 KPI 카드 포함)
     2페이지 = 케이프라이드(전사)+MS팀 특정 (KPI 카드 없음)
     3페이지 = MS팀+I팀 (KPI 카드 없음)
   이 페이지 그룹 순서(보담+백두 묶음)는 화면 전체요약의 표시 순서(보담→케이프라이드→
   MS팀특정→MS팀→I팀→백두)와 다르다 — 사용자가 사진과 동일하게 이 순서가 맞다고
   확인해줬다.
   - 화면(#stage)은 건드리지 않는다 — 오프스크린 #pdfStage에 buildSummaryPdfPage()가
     만드는, 화면용 마크업과는 다른 전용 레이아웃(브랜드바/내비 없이 "9월"/"37주차"
     제목 + KPI행(1페이지만) + 표+차트 섹션 2개)만 넣고 그것만 캡처한다.
   - 표/차트 자체는 summarySection()/sumTable()/sumChart()를 그대로 재사용한다 — 화면과
     로직을 이원화하면 나중에 화면 디자인이 바뀔 때 서로 어긋난다.
   - 페이지당 엔티티 2개(+1페이지는 KPI행까지)라 세로로 넘칠 수 있어, 기존 표
     축소(transform:scale) 로직과 같은 원리로 .sumwrap 전체를 실측해서 필요하면 통째로
     줄여 반드시 한 페이지(1920×1082) 안에 담는다 — "3페이지를 넘지 않는다"는 요구사항의
     핵심 안전장치. */
function pdfEntityFor(key){
  if(key==='ms_t') return KSUB.ms_t;
  if(key==='ms') return KSUB.ms;
  if(key==='it') return KSUB.it;
  return D[key];
}
/* 2026-09-16: 사용자가 첨부 사진으로 직접 확인해 준 페이지 그룹 순서. */
const PDF_SUMMARY_GROUPS = [
  { keys:['bo','bd'], kpi:true },
  { keys:['kp','ms_t'], kpi:false },
  { keys:['ms','it'], kpi:false },
];
/* PDF 전용 페이지 한 장. 화면의 buildSummaryScreen()과 달리 브랜드바/내비가 없고,
   group.keys에 있는 엔티티 2개 분량의 섹션만 담는다. group.kpi가 true인 페이지(1페이지)
   에만 3장짜리 KPI 카드 행을 붙인다.
   2026-09-18(item3·4, 피드백): "상단요약(KPI 카드)을 가장 위로, 월/주차 제목은 그
   아래"로 순서를 다시 바꿨다(2026-09-17 item2는 화면 기준 요청이었고, 이번 피드백은
   PDF 한정 요청). 돈가는 더 이상 4번째 카드가 아니라 summaryTitleRow(true)를 통해
   제목 줄 오른쪽에 인라인으로 붙는다. */
function buildSummaryPdfPage(group){
  const ents = group.keys.map(pdfEntityFor);
  const sections = ents.map(e=>summarySection(e)).join('');
  const kpiRow = group.kpi
    ? `<div class="kbar kbar-sum">${['bo','kp','bd'].map(id=>summaryCostCard(id)).join('')}</div>`
    : '';
  return `<div class="fixed-zone">${kpiRow}${summaryTitleRow(group.kpi)}</div>
  <div class="sumcard"><div class="sumscroll"><div class="sumwrap">
    ${sections}
  </div></div></div>`;
}
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[data-lazy="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.dataset.lazy = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error(`${src} 을(를) 불러오지 못했습니다`));
    document.head.appendChild(s);
  });
}
async function exportSummaryPdf(){
  const btn = document.getElementById('pdfBtn');
  if(!btn || btn.disabled) return;
  btn.disabled = true;

  const overlay = document.createElement('div');
  overlay.id = 'pdfOverlay';
  overlay.innerHTML = '<div>PDF 준비 중…</div>';
  document.body.appendChild(overlay);
  const setProgress = msg=>{ const el = overlay.querySelector('div'); if(el) el.textContent = msg; };

  /* 이 화면(전체 요약)의 실제 S 상태는 건드리지 않는다 — buildSummaryPdfPage()는 S와
     무관하게 항상 각 엔티티의 최신 month/week 배열만 보고 그리므로, 저장/복원할 필요가
     없다(화면도 export 도중 전혀 바뀌지 않는다). */
  FORCE_DESKTOP_EXPORT = true;
  PDF_EXPORT_MODE = true;

  let pdfStage = document.getElementById('pdfStage');
  if(!pdfStage){ pdfStage = document.createElement('div'); pdfStage.id = 'pdfStage'; document.body.appendChild(pdfStage); }

  try{
    setProgress('PDF 도구 불러오는 중…');
    await Promise.all([
      loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
    ]);
    const { jsPDF } = window.jspdf;
    /* #pdfStage와 똑같은 1920×1082 비율로 페이지 크기를 맞춰서, 이미지가 페이지 전체를
       여백 없이 꽉 채운다(letterbox 없음). */
    const PAGE_W_MM = 320, PAGE_H_MM = PAGE_W_MM * (LAYOUT.STAGE_H / LAYOUT.STAGE_W);
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:[PAGE_W_MM, PAGE_H_MM] });

    for(let pageIdx=0; pageIdx<PDF_SUMMARY_GROUPS.length; pageIdx++){
      const group = PDF_SUMMARY_GROUPS[pageIdx];
      setProgress(`PDF 생성 중… (${pageIdx+1}/${PDF_SUMMARY_GROUPS.length})`);

      pdfStage.innerHTML = buildSummaryPdfPage(group);

      /* 표 축소 로직과 같은 원리 — 이번엔 표 하나가 아니라 .sumwrap(엔티티 2개치
         표+차트 전체, 1페이지는 KPI행까지)을 통째로 실측해서, 고정 페이지(1920×1082)
         안에 다 안 들어올 것 같으면 transform:scale로 전체를 줄여 반드시 한 페이지 안에
         담는다. .sumscroll은 #pdfStage 안에서 overflow:hidden으로 오버라이드해뒀으므로
         (위 CSS 참고) 스크롤바가 캡처에 찍히는 일은 없다. */
      const scrollEl = pdfStage.querySelector('.sumscroll');
      const wrapEl = pdfStage.querySelector('.sumwrap');
      if(scrollEl && wrapEl){
        const naturalW = wrapEl.scrollWidth, naturalH = wrapEl.scrollHeight;
        const widthRatio = scrollEl.clientWidth / naturalW;
        const heightRatio = scrollEl.clientHeight / naturalH;
        const scale = Math.min(widthRatio, heightRatio, 1);
        if(scale < 1){
          wrapEl.style.transformOrigin = 'top left';
          wrapEl.style.transform = `scale(${scale})`;
        }
      }

      /* render()가 화면에 대해 매번 하는 후처리(요약 차트 선/점을 실측 위치로 재정렬)를
         pdfStage에도 그대로 해줘야 한다 — scale 적용 후에 실측해야 축소된 실제 위치를
         정확히 잡는다. */
      alignSummaryLines(pdfStage);
      adjustSummaryDotLabels(pdfStage);

      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

      /* PNG 대신 JPEG(용량 절감, jsPDF의 "Invalid string length" 방지 — exportAllPdf 시절
         24장에서 실측된 문제라 3장뿐인 지금은 여유가 있지만 그대로 유지한다). */
      const canvas = await html2canvas(pdfStage, { scale:1.8, backgroundColor:'#f3f5f8', useCORS:true });
      const imgData = canvas.toDataURL('image/jpeg', 0.9);

      if(pageIdx > 0) doc.addPage([PAGE_W_MM, PAGE_H_MM], 'landscape');
      doc.addImage(imgData, 'JPEG', 0, 0, PAGE_W_MM, PAGE_H_MM, undefined, 'FAST');
    }

    const t = new Date();
    const ymd = `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
    doc.save(`주간매출자료_전체요약_${ymd}.pdf`);
  }catch(err){
    console.error('[대시보드] PDF 생성 실패:', err);
    alert('PDF 생성 중 문제가 발생했습니다: ' + ((err&&err.message)||err));
  }finally{
    FORCE_DESKTOP_EXPORT = false;
    PDF_EXPORT_MODE = false;
    if(pdfStage && pdfStage.parentNode) pdfStage.parentNode.removeChild(pdfStage);
    if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    btn.disabled = false;
  }
}

/* 2026-09-09: 주간매출자료 외 카테고리 탭을 없애면서 NAV엔 이제 'sales' 하나뿐이라

/* ══════════════════════ 부트스트랩 — xlsm 로드 후 첫 렌더 ══════════════════════ */

    await bootstrapData();
    /* 월별 배열 길이가 조직마다 다르고(이제 전년 12개월 + 올해 N개월), 초기값(S.mi=11)은
       예전(항상 12개 고정 길이) 기준이라 지금은 최신월을 안 가리킬 수 있다 — 실제 데이터
       기준으로 다시 맞춘다. */
    resetToLatest();
    render();
  }catch(err){
    console.error('[대시보드] 불러오기 실패:', err);
    stage.innerHTML = '<div class="drop"><h3>불러오기 실패</h3><p>' +
      String((err&&err.message)||err).replace(/</g,'&lt;') + '</p></div>';
  }
})();
</script>
</body>
</html>
