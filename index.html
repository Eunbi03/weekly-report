<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간매출자료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e8ecf1}
html.mob,body.mob{height:auto;min-height:100%;overflow-y:auto;overflow-x:hidden}
body{color:#15181d;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums}
/* 191mm : 339mm = 16:9 고정 무대. 화면 크기에 맞춰 자동 축소 */
:root{ --W:1920px; --H:1082px; --pad-h:18px; --pad-v:14px; --gap:8px; --fixed-gap:10px;
  --top-h:50px; --nav1-h:42px; --navrow-h:38px; --kbar-h:132px; --card-h:754px;
  --chart-pad-t:12px; --chart-pad-b:10px; --chd-h:38px; --plot-margin-t:52px }
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:var(--W);height:var(--H);flex:none;background:#f3f5f8;transform-origin:center center;
  display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad-v) var(--pad-h);overflow:hidden}
/* 고정영역(제목·카테고리·상단요약) — 그냥 위쪽에 자리 잡는 일반 블록. */
.fixed-zone{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--fixed-gap)}
/* 아래는 막대/라인/표 중 그 순간 선택된 뷰 "하나만" 차지한다(스크롤 없이 화면을 그대로 채움).
   표 안에서만(.tw) 자체 스크롤이 생긴다. */
.card{background:#fff;border:1px solid #e7eaef;border-radius:12px;box-shadow:0 1px 2px rgba(20,24,29,.04)}
h1,h2{margin:0}
.mut{color:#9aa3af}
button{font-family:inherit;border:none;cursor:pointer}

/* 헤더 */
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;height:var(--top-h);flex:0 0 var(--top-h)}
.brand{display:flex;align-items:center;gap:10px}
.brand .bar{width:8px;height:24px;border-radius:2px}
.brand h1{font-size:27px;font-weight:800;letter-spacing:-.5px}
.brand .unit{font-size:15.5px;color:#9aa3af;font-weight:600;margin-left:2px}
.stepper{display:flex;align-items:center;background:#fff;border:1px solid #e7eaef;border-radius:10px;
  padding:3px 4px;gap:2px}
.stepper button{width:26px;height:26px;border-radius:7px;background:transparent;color:#7a828d;
  font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepper button:hover:not(:disabled){background:#f0f2f6;color:#15181d}
.stepper button:disabled{opacity:.28;cursor:default}
.stepper .lbl{min-width:128px;text-align:center;font-size:15.5px;font-weight:700;letter-spacing:-.3px}

/* 내비 */
.nav1{display:flex;gap:4px;background:#e2e7ee;border-radius:10px;padding:4px;flex:0 0 var(--nav1-h)}
.nav1 button{flex:1;border-radius:7px;font-size:16.5px;font-weight:700;background:transparent;color:#6c7684;
  letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:7px}
.nav1 button:hover{color:#15181d}
.nav1 button.on{background:#15181d;color:#fff}
.navrow{display:flex;gap:8px;align-items:center;flex:0 0 var(--navrow-h)}
.nav2{display:flex;gap:5px}
.nav2 button{padding:0 16px;height:38px;border-radius:8px;font-size:15.5px;font-weight:700;background:#fff;
  border:1px solid #e7eaef;color:#7a828d;display:flex;align-items:center;gap:6px}
.nav2 button.on{color:#fff}
.pip{width:7px;height:7px;border-radius:2px}
.seg{display:flex;background:#e2e7ee;border-radius:8px;padding:3px;height:38px}
.seg button{padding:0 18px;border-radius:6px;font-size:15.5px;font-weight:700;background:transparent;color:#7a828d;white-space:nowrap}
.seg button.on{background:#2A6FDB;color:#fff}
.seg.sm{background:#eceff4}
.seg.sm button{padding:0 16px;font-size:15.5px}
.seg.sm button.on{background:#fff;color:#2A6FDB}
.spacer{flex:1}

/* KPI - 3줄(라벨/값/증감), 왼쪽 정렬, 3칸 모두 동일 폭(grid 1fr×3) */
/* KPI - 카드 3개(또는 KSUB는 2개)가 나란히, 각각 독립된 카드 느낌 */
/* KPI - 기본(컴퓨터/가로)은 원래대로 1줄. 모바일 세로는 진짜 모바일 레이아웃(#stage.portrait)에서 2열 그리드로 */
.kbar{display:flex;gap:10px;flex:0 0 var(--kbar-h);overflow:hidden}
#stage.portrait .kbar{height:auto;flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#stage.portrait .kc{padding:14px 16px;height:auto;border:1px solid #eef1f5;border-radius:10px}
#stage.portrait .kc .l{font-size:13px}
#stage.portrait .kc .v{font-size:23px;margin-top:3px}
#stage.portrait .kc .v small{font-size:13px}
#stage.portrait .kc .d{font-size:11.5px;margin-top:3px}
.kc{flex:1;min-width:0;padding:0 20px 0 44px;display:flex;flex-direction:column;height:100%;
  justify-content:center;align-items:flex-start;text-align:left;overflow:hidden}
.kc .l{font-size:16px;color:#8b93a0;font-weight:700;white-space:nowrap}
.kc .v{font-size:38px;font-weight:800;letter-spacing:-.8px;white-space:nowrap;color:#15181d!important;margin-top:4px}
.kc .v small{font-size:16px;font-weight:700;margin-left:3px;color:#15181d}
.kc .d{font-size:15px;color:#a8b0bb;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;margin-top:4px}
.kc .d b{font-weight:800}

/* 차트 */
.chart{flex:0 0 var(--card-h);height:var(--card-h);padding:var(--chart-pad-t) 18px var(--chart-pad-b);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.chd{display:flex;justify-content:space-between;align-items:center;gap:16px;flex:0 0 var(--chd-h)}
.chd h2{font-size:23px;font-weight:700;letter-spacing:-.3px}
.plot{display:flex;align-items:stretch;margin-top:var(--plot-margin-t)}
.yax{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding-right:9px}
.yax span{font-size:15px;color:#b3bac3}
.area{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
.area-inner{height:100%;min-width:100%}
.canvas{position:relative}
.gl{position:absolute;left:0;right:0;border-top:1px solid #f1f3f6}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:7px;padding:0 5px}
/* 3열(1fr auto 1fr) 그리드 — "올해" 막대는 항상 가운데(auto) 열에 고정해서
   전년 막대가 있든 없든 "올해" 막대의 중심이 항상 칸 정중앙에 오게 한다(선그래프 위치와 일치시키기 위함) */
.bcol{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;height:100%;min-width:0;
  cursor:pointer;border-radius:5px;transition:background .12s}
.bcol:hover{background:#f7f9fc}
.bwrap{position:relative;display:flex;align-items:flex-end;height:100%}
.stk{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:1.5px 1.5px 0 0;overflow:hidden}
.stk.py{border:1.5px dashed #a8b0bb}
.stk span{display:block;width:100%}
.blab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;
  color:#3a4049;white-space:nowrap;z-index:2}
.blab.py{color:#a8b0bb;font-weight:600}
.ovl{position:absolute;inset:0;pointer-events:none;z-index:3;padding:0 5px}
.dotlab{position:absolute;font-size:15px;font-weight:700;color:#15181d;white-space:nowrap;
  background:rgba(255,255,255,.88);padding:0 3px;border-radius:3px;transform:translate(-50%,-125%)}
.xax{display:flex;gap:7px;padding:0 5px;margin-top:7px}
.xax div{flex:1;text-align:center;min-width:0}
.xax b{display:block;font-size:17px;font-weight:600;color:#7a828d}
.xax u{display:block;font-size:14px;color:#b3bac3;text-decoration:none}
.xax div.on b{color:#15181d;font-weight:800}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:16px;padding-top:9px;border-top:1px solid #f1f3f6}
.lgd span{font-size:16px;color:#6c7684;display:flex;align-items:center;gap:5px}
.lgd i{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.lgd i.ln{width:14px;height:0;border-top:2.5px solid;border-radius:0}

/* 표 */
.tcard{flex:0 0 var(--card-h);height:var(--card-h);padding:var(--chart-pad-t) 18px var(--chart-pad-b);display:flex;flex-direction:column;overflow:hidden}
.tw{flex:1;min-width:0;overflow:auto;margin-top:10px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:17px;white-space:nowrap}
th,td{padding:14px 10px;text-align:right;border-bottom:1px solid #f1f3f6}
th{background:#fafbfc;font-size:15.5px;font-weight:700;color:#7a828d;position:sticky;top:0;z-index:2;
  text-align:center;border-bottom:1px solid #e7eaef}
th.g{text-align:center}
th.r2{top:48px}
th.sep,td.sep{border-left:1px solid #e7eaef}
td:first-child,th:first-child{text-align:center;font-weight:700;background:#fff;position:sticky;left:0;z-index:3;
  width:68px;min-width:68px}
th:first-child{background:#fafbfc;z-index:4}
td.sale{font-weight:800;font-size:19px;letter-spacing:-.3px}
tbody tr:hover td{background:#fafbfd}
tbody tr:hover td:first-child{background:#fafbfd}
tr.cur td{background:#fffaef!important}
tr.py td{background:#f6f7f9!important;color:#7a828d!important;font-style:italic}
tr.py td.sale{color:#7a828d!important}

tr.tot td{background:#f2f5f9!important;font-weight:700;border-top:1.5px solid #15181d}
tr.spacer td{padding:6px 0;border:none;background:transparent}
.hot{color:#D64545;font-weight:700}
.cool{color:#1F8A5B;font-weight:700}

/* 팝업 */
.mask{position:fixed;inset:0;background:rgba(20,24,29,.45);display:flex;align-items:center;
  justify-content:center;z-index:99;padding:24px}
.modal{background:#fff;border-radius:16px;width:min(660px,92vw);max-height:86vh;overflow:auto;
  box-shadow:0 18px 50px rgba(20,24,29,.26)}
.mhd{padding:20px 24px 14px;border-bottom:1px solid #eef1f5;display:flex;justify-content:space-between;align-items:flex-start}
.mhd h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px}
.mhd .tot{margin-top:4px;font-size:13px;color:#7a828d}
.mhd .x{width:30px;height:30px;border-radius:8px;background:#f0f2f6;color:#6c7684;font-size:16px;font-weight:700}
.mrow{display:grid;grid-template-columns:112px 1fr 126px;align-items:center;gap:12px;padding:7px 24px}
.mrow .nm{display:flex;align-items:center;gap:7px;min-width:0}
.mrow .nm i{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.mrow .nm span{font-size:13px;font-weight:600;color:#3a4049;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtrack{height:18px;background:#f3f5f8;border-radius:5px;overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:5px}
.mval{text-align:right}
.mval b{font-size:14px;font-weight:800;letter-spacing:-.3px}
.mval u{display:block;font-size:11px;color:#9aa3af;text-decoration:none}
.mft{padding:10px 24px 18px}

/* 대기 화면 */
.drop{flex:1;border:2px dashed #d3dae4;border-radius:12px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.drop h3{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0}
.drop p{margin:9px 0 0;font-size:13px;color:#7a828d;line-height:1.8}
.drop code{background:#eef1f5;padding:3px 9px;border-radius:6px;font-size:13px;font-weight:600;color:#2A6FDB}

/* 세로(모바일 세로) 모드 전용 — 가로일 땐 원래 균등폭 그대로, 세로일 때만
   카테고리 줄(대분류·소분류)이 내용만큼만 차지하고 넘치면 가로로 스크롤되게 바꾼다. */
#stage.portrait .nav1{overflow-x:auto;overflow-y:hidden}
#stage.portrait .nav1 button{flex:0 0 auto;padding:0 20px}
#stage.portrait .navrow{overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
#stage.portrait .nav2{flex:0 0 auto}
#stage.portrait .nav2 button{flex:0 0 auto}

/* ══════════════════════ 진짜 모바일 전용 레이아웃 ══════════════════════
   예전엔 1920px 데스크탑 화면을 그대로 축소(transform:scale)해서 넣다 보니
   글씨까지 전부 20% 크기로 쪼그라들어 사실상 안 보였다. 이제 모바일에서는
   축소를 아예 하지 않고(scale:none) 원래 폰트 크기를 그대로 쓰면서,
   가로 폭에 안 맞는 요소만 세로로 쌓거나 가로 스크롤 되도록 다시 배치한다.
   화면 하나에 다 우겨넣지 않고 페이지 자체가 세로로 스크롤된다. */
body.mob{height:auto;min-height:100%;overflow-y:auto;overflow-x:hidden}
#viewport.mob{position:static;display:block;height:auto;padding:0}
#stage.portrait{width:100%!important;height:auto!important;transform:none!important;
  overflow:visible;padding:14px 12px 24px}
#stage.portrait .fixed-zone{gap:10px}
#stage.portrait .top{height:auto;flex-wrap:wrap;row-gap:6px}
#stage.portrait .brand h1{font-size:21px}
#stage.portrait .brand .unit{font-size:12px}
#stage.portrait .stepper .lbl{font-size:14px;min-width:92px}
#stage.portrait .navrow{height:auto;padding-bottom:2px}
#stage.portrait .nav2 button{height:36px;font-size:14px;padding:0 12px}
#stage.portrait .seg{height:36px}
#stage.portrait .seg button{font-size:13px;padding:0 11px}
#stage.portrait .kc .d{white-space:normal;text-overflow:clip;overflow:visible;line-height:1.4}
/* "전월 대비 ~" 와 "목표 ~"가 한 줄에 억지로 같이 있으면 "목표"가 중간에 잘려 다음 줄로
   넘어간다. 모바일에서는 가운뎃점 구분자 대신 아예 줄바꿈으로 분리한다. */
#stage.portrait .kc .d .d-sep{display:none}
#stage.portrait .kc .d .d-note{display:block;margin-top:2px}
#stage.portrait .chart,#stage.portrait .tcard{height:auto;flex:none;padding:12px 14px 16px}
#stage.portrait .chd h2{font-size:16px}
#stage.portrait .tw{max-height:65vh;scroll-snap-type:x mandatory;scroll-padding-left:71px}
/* scroll-padding-left: 고정된 "구분" 칸 폭만큼 여유를 줘야, 스냅했을 때 다음 칸이
   그 고정 칸 뒤에 숨지 않고 바로 옆에 온전히 나타난다. */
/* 옆으로 스크롤하다 아무 데서나 멈추면 칸이 반쯤 잘려 걸쳐 보인다.
   그래서 "구분" 바로 다음(요약 칸들의 시작)과, 거래처별 칸 그룹이 시작하는 지점(.sep)에만
   스냅 포인트를 둬서, 스크롤을 놓으면 항상 칸이 온전히 보이는 위치로 자동으로 붙게 한다. */
#stage.portrait .tw th:nth-child(2),#stage.portrait .tw td:nth-child(2),
#stage.portrait .tw .sep{scroll-snap-align:start}
/* 세로 스크롤 스냅으로 "머리말 2줄(그룹명+목표/매출/달성율) 뒤에 데이터 행을 딱 맞춘다"를
   시도했지만, 실제 폰 브라우저에서는 스냅이 정확히 안 먹혀서 오히려 데이터 행이 머리말
   사이에 끼어 보이는 더 심한 문제가 생겼다. 그래서 세로 스냅만 걷어낸다 — 머리말이 스크롤해도
   계속 위에 떠 있는 기능(position:sticky;top)은 원래 desktop과 똑같이 그대로 살려 둔다.
   (가로 스크롤 스냅만 유지: 이건 스냅과 세로 위치가 무관해서 문제를 일으키지 않는다.) */
#stage.portrait table{font-size:14px}
/* 위 th.r2{top:48px}는 데스크탑 1번째 머리말 줄 높이(48px) 기준인데, 모바일은 글씨가
   작아져서 1번째 줄 실제 높이가 36px뿐이다. 그 차이(12px)만큼 2번째 줄이 아래로 붕 떠서
   고정되다 보니, 그 틈으로 스크롤되는 내용이 살짝 비쳐 보였다 — 모바일 실제 높이로 맞춘다. */
#stage.portrait th.r2{top:36px}
#stage.portrait th{font-size:11.5px}
#stage.portrait td,#stage.portrait th{padding:10px 7px}
#stage.portrait td.sale{font-size:14px}
#stage.portrait .mask{padding:16px}
/* 모바일 막대그래프 — 가로 스크롤 대신 항목을 세로로 쌓고, 막대는 가로로 눕혀서
   한 화면 폭 안에서 값 전체가 겹침 없이 다 보이게 한다(그 대신 글씨는 조금 작게). */
.hbars{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.hbar-row{cursor:pointer}
.hbar-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.hbar-lbl{font-size:15px;font-weight:800;color:#15181d}
.hbar-row.on .hbar-lbl{color:#2A6FDB}
.hbar-cost{font-size:12px;font-weight:700;color:#c8842a}
.hbar-yoy{font-size:12px;font-weight:700;color:#9aa3af}
.hbar-track-wrap{position:relative}
.hbar-track{position:relative;height:32px;border-radius:2.5px;background:#f0f2f6;overflow:hidden;
  display:flex}
.hbar-track span{display:block;height:100%}
.hbar-track-val{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:16px;font-weight:800;color:#15181d;letter-spacing:-.2px;white-space:nowrap;z-index:2}
.hbar-py{position:relative;height:9px;border-radius:1.5px;background:#f5f6f8;overflow:hidden;
  display:flex;margin-top:4px;border:1px dashed #d3dae4}
.hbar-py span{display:block;height:100%;opacity:.75}
@media print{ @page{size:339mm 191mm;margin:0} html,body{background:#fff}
  #viewport{position:static} #stage{transform:none!important} }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="pop"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   데이터 — 매주 여기만 고칩니다  (단위: 백만원)
   1) META 의 month / week 를 이번 회차로
   2) 각 법인·팀의 month / week 배열 끝에 한 줄 추가
   3) ch 배열 순서 = 그 조직 chans 순서
   4) chT = 연간 거래처별 목표 (월 목표는 ÷12, 주 목표는 ÷52 로 자동 산출)
══════════════════════════════════════════════════════════════ */
const META = { updated:'2026-08-18 09:00' };
/* ══════════════════════ 레이아웃 상수 — 여기 몇 개만 바꾸면 카드 높이·캔버스 높이가 전부 자동 재계산됨 ══════════════════════
   지금까지 KPI 높이 하나 바꿀 때마다 차트 높이(754px), 캔버스 높이(CHART_H) 등을 전부 손으로 다시 계산해서
   맞춰왔는데, 그 계산 과정 자체를 코드로 옮겨서 더 이상 손계산 없이 자동으로 맞게 만든 것. */
const LAYOUT = {
  STAGE_W: 1920, STAGE_H: 1082,      // #stage 크기 (가로 기준. 세로/모바일은 fit()에서 STAGE_H만 별도 계산)
  PAD_H: 18, PAD_V: 14,              // #stage 좌우/상하 패딩
  GAP: 8,                            // #stage의 직계 자식(고정영역 / 차트·표 카드) 사이 간격

  TOP_H: 50, NAV1_H: 42, NAVROW_H: 38, KBAR_H: 132,  // 고정영역 안의 4개 줄 높이
  FIXED_GAP: 10,                     // 고정영역 안 4개 줄 사이 간격

  CHART_PAD_T: 12, CHART_PAD_B: 10,  // .chart/.tcard 카드 자체의 상하 패딩
  CHD_H: 38,                         // 카드 제목 줄(막대/라인/표 토글 포함) 높이
  PLOT_MARGIN_T: 52,                 // 제목 줄과 실제 그래프 사이 여백
  XAX_H: 44,                         // x축 라벨 영역(전년비 라벨 있는 열 기준, 2줄로 가장 큰 경우)
  LGD_H: 68,                         // 범례 영역(채널이 가장 많은 조직·2줄 기준 최댓값)
};
/* 고정영역 전체 높이 = 4줄 + 그 사이 간격 3개 */
LAYOUT.FIXED_ZONE_H = LAYOUT.TOP_H + LAYOUT.NAV1_H + LAYOUT.NAVROW_H + LAYOUT.KBAR_H + LAYOUT.FIXED_GAP*3;
/* 모바일(세로)에서는 화면 하나에 다 우겨넣는 "무대" 개념 자체를 쓰지 않는다 — 카드 높이는
   내용에 맞춰 자동(auto)으로 늘어나고 페이지가 세로 스크롤된다. 대신 차트 캔버스만은 보기 좋은
   고정 높이를 직접 지정한다(막대 높이는 % 기반이라 이 값에 맞춰 알아서 다시 그려진다).
   render()가 HTML을 만들기 "전"에 반드시 먼저 호출해야 캔버스 인라인 높이(px)에 반영된다. */
const MOBILE_CHART_H = 300;
function recalcCardLayout(mobile){
  if(mobile){ LAYOUT.CHART_H = MOBILE_CHART_H; LAYOUT.CARD_H = null; return; }
  /* 데스크탑(가로) — 무대 전체 높이 기준으로 카드/캔버스 높이를 역산 */
  LAYOUT.CARD_H = LAYOUT.STAGE_H - LAYOUT.PAD_V*2 - LAYOUT.FIXED_ZONE_H - LAYOUT.GAP;
  LAYOUT.CHART_H = LAYOUT.CARD_H - LAYOUT.CHART_PAD_T - LAYOUT.CHART_PAD_B - LAYOUT.CHD_H - LAYOUT.PLOT_MARGIN_T - LAYOUT.XAX_H - LAYOUT.LGD_H;
}
recalcCardLayout(false);

/* 위 숫자들을 실제 CSS에 그대로 꽂아 넣는다 — CSS 쪽은 전부 var(--xxx)를 참조하므로,
   LAYOUT 값만 바꾸면 CSS까지 자동으로 따라간다. */
function applyLayout(){
  const r = document.documentElement.style;
  r.setProperty('--pad-h', LAYOUT.PAD_H+'px');
  r.setProperty('--pad-v', LAYOUT.PAD_V+'px');
  r.setProperty('--gap', LAYOUT.GAP+'px');
  r.setProperty('--fixed-gap', LAYOUT.FIXED_GAP+'px');
  r.setProperty('--top-h', LAYOUT.TOP_H+'px');
  r.setProperty('--nav1-h', LAYOUT.NAV1_H+'px');
  r.setProperty('--navrow-h', LAYOUT.NAVROW_H+'px');
  r.setProperty('--kbar-h', LAYOUT.KBAR_H+'px');
  r.setProperty('--card-h', LAYOUT.CARD_H+'px');
  r.setProperty('--chart-pad-t', LAYOUT.CHART_PAD_T+'px');
  r.setProperty('--chart-pad-b', LAYOUT.CHART_PAD_B+'px');
  r.setProperty('--chd-h', LAYOUT.CHD_H+'px');
  r.setProperty('--plot-margin-t', LAYOUT.PLOT_MARGIN_T+'px');
}

/* ══════════════════════════════════════════════════════════════
   데이터 — 더 이상 이 파일에 숫자를 직접 넣지 않는다.
   브라우저가 열릴 때 이 저장소에 들어있는 주간매출자료-26NN.xlsm 파일을
   SheetJS로 직접 읽어서 D/KSUB를 그 자리에서 만든다.
   매주 할 일은 xlsm 파일 교체(그 폴더엔 xlsm이 항상 1개만) + git push 뿐,
   이 파일(index.html)은 시트 구조 자체가 바뀔 때만 CELLMAP을 손본다.
   (참고: dashboard-data-sync 스킬 문서)
══════════════════════════════════════════════════════════════ */
function monthLabel(id){ return (+id.slice(5))+'월'; }
const MLAB = new Proxy({}, { get:(_,id)=> typeof id==='string' ? monthLabel(id) : undefined });

/* ---------- 파일 자동탐색 ---------- */
async function findWorkbookFile(){
  const years = [];
  const now = new Date();
  const baseYY = now.getFullYear()%100;
  for(const yy of [baseYY-1, baseYY, baseYY+1]) years.push(String(yy).padStart(2,'0'));
  const candidates = [];
  for(const yy of years) for(let w=1; w<=53; w++) candidates.push(`주간매출자료-${yy}${String(w).padStart(2,'0')}.xlsm`);
  const found = [];
  await Promise.all(candidates.map(async name=>{
    try{
      const res = await fetch(name, {method:'HEAD', cache:'no-store'});
      if(res.ok) found.push(name);
    }catch(e){ /* 존재하지 않음 — 무시 */ }
  }));
  if(found.length===0) throw new Error('주간매출자료-26NN.xlsm 파일을 찾을 수 없습니다. (이 저장소 폴더에 xlsm 파일이 올라와 있는지 확인해주세요)');
  if(found.length>1) console.warn('[대시보드] 후보 파일이 여러 개 발견됨(오래된 파일을 지워주세요):', found);
  return found.sort().slice(-1)[0];
}
/* 2026-09-09: 화면 로딩 속도 개선.
   1) fetch cache:'no-cache' — 매번 서버에 최신 여부는 확인하지만(항상 최신 데이터 보장),
      xlsm 파일 내용이 그대로면(주중 재방문 등) 브라우저가 본문(수 MB~십수 MB)을
      다시 받지 않고 304로 짧게 끝낼 수 있다. 'no-store'는 이 확인 절차 자체를 건너뛰고
      매번 무조건 전체를 새로 받아서 느렸다.
   2) 이 워크북엔 대시보드가 전혀 쓰지 않는 원천 ERP DATA 시트(판매현황DATA 등)가
      들어있는데, 이게 주차가 쌓일수록 수만 행까지 불어나 있어(예: 6만행) SheetJS가
      "전체" 시트를 다 파싱하면 그것만으로 수 초가 걸린다. 대시보드가 실제로 읽는
      시트만 골라 파싱하도록 sheets 옵션을 쓴다 — 전년 비교 시트 이름(YYYY년-XX)은
      연도를 알아야 정해지므로, 먼저 '집계' 시트만 가볍게 읽어 연도를 얻은 뒤
      그 연도로 필요한 시트 전체를 다시 한 번(이번엔 딱 필요한 것만) 읽는다. */
const NEEDED_SHEETS_BASE = ['집계','보담통합','백두통합','케이통합','케이I','케이MS'];
const LEGACY_SHEET_SUFFIXES = ['보담','백두','케이','케이MS특정','케이MS','케이I'];
async function loadWorkbook(){
  const fname = await findWorkbookFile();
  const res = await fetch(fname, {cache:'no-cache'});
  if(!res.ok) throw new Error(`${fname} 파일을 불러오지 못했습니다 (HTTP ${res.status})`);
  const buf = await res.arrayBuffer();
  const probe = XLSX.read(buf, {type:'array', cellFormula:false, sheets:['집계']});
  const legacyYear = readCutoff(probe).year - 1;
  const needed = NEEDED_SHEETS_BASE.concat(LEGACY_SHEET_SUFFIXES.map(n=>`${legacyYear}년-${n}`));
  const wb = XLSX.read(buf, {type:'array', cellFormula:false, sheets: needed});
  return { wb, fname };
}

/* ---------- 시트 → 배열 변환 + 셀 접근 헬퍼 ---------- */
function aoa(wb, sheetName){
  const ws = wb.Sheets[sheetName];
  if(!ws) throw new Error(`시트를 찾을 수 없습니다: ${sheetName}`);
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}
function hasSheet(wb, sheetName){ return !!wb.Sheets[sheetName]; }
function cellAt(rows, r, c){ const row = rows[r-1]; if(!row) return null; const v = row[c-1]; return (v===undefined)?null:v; }
function numAt(v){ return (typeof v==='number' && isFinite(v)) ? v : null; }
function colNum(letter){ return XLSX.utils.decode_col(letter)+1; }

function readCutoff(wb){
  const rows = aoa(wb, '집계');
  const week = numAt(cellAt(rows,2,1)), year = numAt(cellAt(rows,2,2)), month = numAt(cellAt(rows,2,3));
  if(week==null||year==null||month==null) throw new Error('집계 시트의 주차/년/월(A2/B2/C2) 값을 읽을 수 없습니다');
  return { week, year, month };
}

/* chan spec: [name,color,tgtLetter] → 매출 = 목표+1칸  |  [name,color,null,salesLetter] → 목표 없음, 매출은 salesLetter 그대로 */
function readRow(rows, r, chans, opt){
  opt = opt||{};
  const t = opt.noTotal ? null : numAt(cellAt(rows,r,colNum(opt.tCol||'B')));
  const s = numAt(cellAt(rows,r,colNum(opt.sCol||'C')));
  const out = {t,s};
  if(opt.cCol){ const raw = numAt(cellAt(rows,r,colNum(opt.cCol))); out.c = raw!=null ? raw*100 : null; }
  if(opt.loanCol){ out.loan = numAt(cellAt(rows,r,colNum(opt.loanCol))); }
  out.ch = chans.map(([,,tgtL,salesL])=>{
    if(tgtL) return numAt(cellAt(rows, r, colNum(tgtL)+1));
    return numAt(cellAt(rows, r, colNum(salesL)));
  });
  return out;
}
function chanTargets(rows, totalRow, chans){
  return chans.map(([,,tgtL])=> tgtL ? numAt(cellAt(rows, totalRow, colNum(tgtL))) : null);
}
/* 채널 합 vs 총매출 실측 검산 — CELLMAP이 실제 구조와 어긋나면 콘솔에 바로 드러나게 */
function warnIfMismatch(label, r){
  if(r.s==null) return;
  const known = r.ch.filter(v=>v!=null);
  if(!known.length) return;
  const sum = known.reduce((a,b)=>a+b,0);
  const pct = Math.abs(r.s-sum)/Math.max(1,Math.abs(r.s))*100;
  if(pct>8) console.warn(`[대시보드] ${label}: 채널합(${sum.toFixed(1)})이 총매출(${r.s.toFixed(1)})과 ${pct.toFixed(1)}% 차이 — CELLMAP 확인 필요`);
}

/* ---------- CELLMAP: 법인 통합 3개 + 케이I — 고정 행(4~15월,16합계 / 21~73주,74합계) ---------- */
const ORG_CELLMAP = {
  bo: { sheet:'보담통합', legacySheet:y=>`${y}년-보담`, cCol:'E',
        chans:[['이마트','#F6B76A','F'],['온라인','#7FA6F3','I'],['에브리','#A4ACBA','L'],['쿠팡','#76D0ED','O'],['홈플러스','#61BB8F','R'],['도소매/기타','#D5D5D5','U'],['F&B','#CF8A72','Z']],
        legacyChans:[['이마트','이마트'],['온라인','에스에스지닷컴'],['에브리','에브리데이'],['쿠팡','쿠팡'],['홈플러스','홈플러스'],['도소매/기타','도소매'],['F&B',null]] },
  bd: { sheet:'백두통합', legacySheet:y=>`${y}년-백두`, cCol:'E',
        chans:[['하이퍼','#ED9272','F'],['익스프레스','#7FA6F3','I'],['도소매/기타','#A48D75','L']],
        legacyChans:[['하이퍼','하이퍼'],['익스프레스','익스프레스'],['도소매/기타','도소매/기타']] },
  kp: { sheet:'케이통합', legacySheet:y=>`${y}년-케이`, cCol:'E',
        chans:[['MS팀 특정','#8C82B7','F'],['MS팀','#729BD5','K'],['I팀','#73C19A','N'],['임가공','#BBB09E',null,'Q'],['OEM','#8E6C4B',null,'R']],
        legacyChans:[['MS팀 특정','MS팀 특정'],['MS팀','MS팀'],['I팀','I팀'],['임가공',null,'V'],['OEM',null,'AA']] },
  it: { sheet:'케이I', legacySheet:y=>`${y}년-케이I`, cCol:false,
        chans:[['급식','#1F8A5B','D'],['군납','#5FB08C','G'],['기타(도소매)','#D98A2B','J']],
        legacyChans:[['급식','급식'],['군납','군납'],['기타(도소매)','기타']] },
};
function readFixedCurrent(wb, key, cutoff){
  const def = ORG_CELLMAP[key];
  const rows = aoa(wb, def.sheet);
  const opt = def.cCol ? {cCol:def.cCol} : {};
  const month=[], week=[];
  for(let m=1;m<=Math.min(cutoff.month,12);m++){ const r=Object.assign({id:m}, readRow(rows,3+m,def.chans,opt)); warnIfMismatch(`${def.sheet} ${m}월`, r); month.push(r); }
  for(let w=1;w<=Math.min(cutoff.week,53);w++){ const r=Object.assign({id:w}, readRow(rows,20+w,def.chans,opt)); warnIfMismatch(`${def.sheet} ${w}주`, r); week.push(r); }
  const chT = chanTargets(rows, 16, def.chans);
  return {month, week, chT};
}

/* ---------- 전년(YYYY년-XX) 비교 시트 — 라벨/서브헤더 텍스트로 직접 찾아 읽는다 (열 고정 X) ---------- */
function rowLabels(rows, r){
  const out=[]; const row = rows[r-1]||[];
  row.forEach((v,i)=>{ if(typeof v==='string' && v.trim()!=='' && i+1>2 && v.trim()!=='구분' && v.trim()!=='종합') out.push({col:i+1, label:v.trim()}); });
  return out.sort((a,b)=>a.col-b.col);
}
function findTextCol(rows, r, fromCol, toCol, want){
  for(let c=fromCol;c<toCol;c++){ const v=cellAt(rows,r,c); if(typeof v==='string' && v.trim()===want) return c; }
  return null;
}
function readLegacySheet(rows, chanNameMap){
  const labelRow=2, subRow=3, dataStartRow=4, dataRowCount=12;
  const labels = rowLabels(rows, labelRow);
  const firstLabelCol = labels.length ? labels[0].col : 200;
  const totT = findTextCol(rows, subRow, 2, firstLabelCol, '목표');
  const totS = findTextCol(rows, subRow, 2, firstLabelCol, '매출');
  const totC = findTextCol(rows, subRow, 2, firstLabelCol, '매출원가율');
  const chanCols = {};
  labels.forEach((lb,i)=>{
    const nextCol = labels[i+1] ? labels[i+1].col : (rows[subRow-1]||[]).length+1;
    chanCols[lb.label] = { t: findTextCol(rows, subRow, lb.col, nextCol, '목표'), s: findTextCol(rows, subRow, lb.col, nextCol, '매출') };
  });
  const out=[];
  for(let i=0;i<dataRowCount;i++){
    const r = dataStartRow+i;
    const t = totT? numAt(cellAt(rows,r,totT)) : null;
    const s = totS? numAt(cellAt(rows,r,totS)) : null;
    const cRaw = totC? numAt(cellAt(rows,r,totC)) : null;
    const ch = chanNameMap.map(([,legacyLabel,directCol])=>{
      if(directCol) return numAt(cellAt(rows, r, colNum(directCol)));
      if(!legacyLabel) return null;
      const cc = chanCols[legacyLabel];
      if(!cc || cc.s==null) return null;
      return numAt(cellAt(rows, r, cc.s));
    });
    out.push({ id:i+1, t, s, c: cRaw!=null?cRaw*100:null, ch });
  }
  return out;
}
function readLegacyOrg(wb, key, cutoff){
  const def = ORG_CELLMAP[key];
  const sheetName = def.legacySheet(cutoff.year-1);
  if(!hasSheet(wb, sheetName)){ console.warn(`[대시보드] 전년 비교 시트 없음: ${sheetName} (1년 흐름/전년비교가 일부 비어 보일 수 있음)`); return null; }
  return readLegacySheet(aoa(wb, sheetName), def.legacyChans);
}

/* ---------- CELLMAP: 케이MS 시트 안의 "특정" / "직납" / "온라인 및 그 외" 블록 — 라벨+상대행
   2026-09-03: "직납/온라인/기타"였던 단일 블록이 "직납"(4채널) + "온라인 및 그 외"(7채널, OEM 포함)
   두 블록으로 분리됐다 — 매주 xlsm 구조는 바뀔 수 있으니 라벨 텍스트로 찾고, 옛 이름도 폴백으로 남겨둔다. ---------- */
const MS_T_CHANS = [['홈플러스','#61BB8F','F'],['하나로','#5CCDA9','L'],['에브리','#A4ACBA','R'],['현대','#728FB9','X'],['신세계','#CE655A','AD'],['롯데','#A78C7A','AJ'],['GS','#668FDD','AP'],['이마트','#F6B76A','AV'],['킴스','#C7C7C7','BB'],['위탁행사','#B1A897','BH'],['순회행사','#E1E1E1','BN']];
const MS_JIKNAP_CHANS = [['이마트','#F6B76A','D'],['에브리데이','#A4ACBA','G'],['하이퍼','#ED9272','J'],['익스','#7FA6F3','M']];
const MS_ONLINE_CHANS = [['쿠팡','#76D0ED','D'],['토스','#50A2EB','G'],['컬리','#9876B5','J'],['네이버','#5BC438','M'],['위탁채널','#B1A897','P'],['기타','#D5D5D5','S'],['OEM','#8E6C4B','V']];
const MS_T_LEGACY = [['홈플러스','하이퍼'],['하나로','하나로'],['에브리','에브리데이'],['현대','현대'],['신세계','신세계'],['롯데','롯데'],['GS',null],['이마트','이마트'],['킴스','킴스'],['위탁행사','위탁행사'],['순회행사','순회행사']];
/* 전년(2025년-케이MS) 시트는 아직 직납/온라인이 한 블록으로 합쳐져 있어서, 현재 11채널(직납4+온라인7) 순서에 맞춰 매핑 */
const MS_LEGACY = [['이마트',null],['에브리데이',null],['하이퍼','하이퍼 직납'],['익스','익스 직납'],['쿠팡','쿠팡'],['토스',null],['컬리',null],['네이버',null],['위탁채널','위탁채널'],['기타','기타'],['OEM',null,'X']];

function findLabelRow(rows, label){
  for(let r=1;r<=rows.length;r++){
    const row = rows[r-1]||[];
    for(let c=1;c<=row.length;c++){ if(typeof row[c-1]==='string' && row[c-1].trim()===label) return r; }
  }
  return null;
}
function readLabelBlock(rows, labelRow, chans, cutoff, opt){
  const monthRow = m=>labelRow+2+m, totalMRow=labelRow+15, weekRow=w=>labelRow+19+w;
  const month=[], week=[];
  for(let m=1;m<=Math.min(cutoff.month,12);m++){ const r=Object.assign({id:m}, readRow(rows, monthRow(m), chans, opt)); warnIfMismatch(`케이MS ${m}월`, r); month.push(r); }
  for(let w=1;w<=Math.min(cutoff.week,53);w++){ const r=Object.assign({id:w}, readRow(rows, weekRow(w), chans, opt)); warnIfMismatch(`케이MS ${w}주`, r); week.push(r); }
  const chT = chanTargets(rows, totalMRow, chans);
  return {month, week, chT};
}
/* 직납 블록 + 온라인 블록을 하나의 "MS팀"으로 합친다 — t/s는 더하고 채널은 이어붙인다 */
function mergeBlocks(a, b){
  const mergeRows = (ra, rb) => ra.map((r0,i)=>{
    const r1 = rb[i];
    return { id:r0.id, t:(r0.t||0)+(r1.t||0), s:(r0.s||0)+(r1.s||0), ch:r0.ch.concat(r1.ch) };
  });
  return { month: mergeRows(a.month,b.month), week: mergeRows(a.week,b.week), chT: a.chT.concat(b.chT) };
}
function readKsubCurrent(wb, cutoff){
  const rows = aoa(wb, '케이MS');
  const msTRow = findLabelRow(rows, '특정');
  const jiknapRow = findLabelRow(rows, '직납');
  const onlineRow = findLabelRow(rows, '온라인 및 그 외') || findLabelRow(rows, '직납/온라인/기타');
  if(msTRow==null) throw new Error('케이MS 시트에서 "특정" 라벨을 찾지 못했습니다 — 시트 구조가 바뀐 것 같습니다');
  if(jiknapRow==null) throw new Error('케이MS 시트에서 "직납" 라벨을 찾지 못했습니다 — 시트 구조가 바뀐 것 같습니다');
  if(onlineRow==null) throw new Error('케이MS 시트에서 "온라인 및 그 외" 라벨을 찾지 못했습니다 — 시트 구조가 바뀐 것 같습니다');
  const msT = readLabelBlock(rows, msTRow, MS_T_CHANS, cutoff, {tCol:'B', sCol:'C', loanCol:'D'});
  const jiknap = readLabelBlock(rows, jiknapRow, MS_JIKNAP_CHANS, cutoff, {tCol:'B', sCol:'C'});
  const online = readLabelBlock(rows, onlineRow, MS_ONLINE_CHANS, cutoff, {tCol:'B', sCol:'C'});
  return { msT, ms: mergeBlocks(jiknap, online) };
}
const MS_ALL_CHANS = MS_JIKNAP_CHANS.concat(MS_ONLINE_CHANS); // 색상/이름 목록용(직납4+온라인7=11채널)
function readLegacyKsub(wb, cutoff){
  const yy = cutoff.year-1;
  const tName = `${yy}년-케이MS특정`, mName = `${yy}년-케이MS`, iName = `${yy}년-케이I`;
  const safe = (name, map) => hasSheet(wb,name) ? readLegacySheet(aoa(wb,name), map) : (console.warn(`[대시보드] 전년 비교 시트 없음: ${name}`), null);
  return { msT: safe(tName, MS_T_LEGACY), ms: safe(mName, MS_LEGACY), it: safe(iName, ORG_CELLMAP.it.legacyChans) };
}

/* ---------- 조립: 트레일링 12개월(법인 3사) / Jan(전년)~cutoff(올해) (KSUB 3팀) ---------- */
function monthId(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function trailingMonths(endY, endM, n){
  const out=[]; let y=endY, m=endM;
  for(let i=0;i<n;i++){ out.unshift({y,m}); m--; if(m<1){m=12;y--;} }
  return out;
}
function pickMonth(arr, m){ return arr ? arr.find(r=>r.id===m) : null; }

function buildOrgEntity(key, name, color, cur, curData, legacyData){
  const def = ORG_CELLMAP[key];
  /* 월별 배열 = 전년 1~12월(트레일링 계산의 "뒷받침용" 과거 구간, 직접 선택은 안 됨) +
     올해 1월~기준월. KSUB(buildKsubEntity)와 똑같은 형태로 맞춰서, "선택한 달 기준
     트레일링 12개월"이 8월이든 1월이든 항상 꽉 찬 12개로 나오게 한다(2026-09-08 확립) —
     예전엔 항상 "기준월까지의 최근 12개월"로만 고정 길이였어서, 올해 1월처럼 이른 달을
     선택하면 트레일링 창이 전년 데이터 없이 짧아졌었다. 실제 선택 가능한 최소 인덱스는
     resetToLatest/step()이 "올해 1월"(=이 배열의 12번째, 0-based 인덱스 12)로 제한한다. */
  const month = [];
  for(let m=1;m<=12;m++){
    const y = cur.year-1;
    const rec = pickMonth(legacyData, m);
    month.push(rec ? {id:monthId(y,m), t:rec.t, s:rec.s, c:rec.c, ch:rec.ch} : {id:monthId(y,m), t:null, s:null, c:null, ch:null});
  }
  for(let m=1;m<=cur.month;m++){
    const rec = pickMonth(curData.month, m);
    month.push(rec ? {id:monthId(cur.year,m), t:rec.t, s:rec.s, c:rec.c, ch:rec.ch} : {id:monthId(cur.year,m), t:null, s:null, c:null, ch:null});
  }
  const prevM = {};
  for(let m=Math.max(1,cur.month-2); m<=cur.month; m++){
    const rec = pickMonth(legacyData, m);
    if(rec) prevM[monthId(cur.year,m)] = {t:rec.t, s:rec.s, c:rec.c, ch:rec.ch};
  }
  const week = curData.week.map(r=>({id:'W'+r.id, t:r.t, s:r.s, c:r.c, ch:r.ch}));
  return {
    id:key, name, color,
    chans: def.chans.map(([n,c])=>({n,c})),
    chT: curData.chT,
    month, week, prevM, prevW:{}
  };
}
function buildKsubEntity(name, color, hasLoan, chansSpec, cur, curData, legacyData){
  const month=[];
  for(let m=1;m<=12;m++){
    const rec = pickMonth(legacyData, m);
    const y = cur.year-1;
    const row = { id: monthId(y,m), t: rec?rec.t:null, s: rec?rec.s:null, ch: rec?rec.ch:null };
    if(hasLoan) row.loan = null; // 전년 대출액 데이터는 원본 시트에 없음(미제공)
    month.push(row);
  }
  for(let m=1;m<=cur.month;m++){
    const rec = pickMonth(curData.month, m);
    const row = { id: monthId(cur.year,m), t: rec?rec.t:null, s: rec?rec.s:null, ch: rec?rec.ch:null };
    if(hasLoan) row.loan = rec && rec.loan!=null ? rec.loan : null;
    month.push(row);
  }
  const week = curData.week.map(r=>{
    const row = {id:'W'+r.id, t:r.t, s:r.s, ch:r.ch};
    if(hasLoan) row.loan = r.loan!=null? r.loan : null;
    return row;
  });
  const out = { name, color, chans: chansSpec.map(([n,c])=>({n,c})), chT: curData.chT, month, week };
  if(hasLoan) out.hasLoan = true;
  return out;
}

let D = null, KSUB = null;

async function bootstrapData(){
  const { wb, fname } = await loadWorkbook();
  const cutoff = readCutoff(wb);
  META.updated = `${fname} · ${cutoff.year}년 ${cutoff.month}월 · ${cutoff.week}주차 기준`;

  const boC = readFixedCurrent(wb,'bo',cutoff), bdC = readFixedCurrent(wb,'bd',cutoff),
        kpC = readFixedCurrent(wb,'kp',cutoff), itC = readFixedCurrent(wb,'it',cutoff);
  const boL = readLegacyOrg(wb,'bo',cutoff), bdL = readLegacyOrg(wb,'bd',cutoff),
        kpL = readLegacyOrg(wb,'kp',cutoff);
  const { msT: msTC, ms: msC } = readKsubCurrent(wb, cutoff);
  const { msT: msTL, ms: msL, it: itL } = readLegacyKsub(wb, cutoff);

  D = {
    bo: buildOrgEntity('bo','보담','#1566B2', cutoff, boC, boL),
    bd: buildOrgEntity('bd','백두','#259638', cutoff, bdC, bdL),
    kp: buildOrgEntity('kp','케이프라이드','#F28C02', cutoff, kpC, kpL),
  };
  KSUB = {
    ms_t: buildKsubEntity('MS팀 특정','#2A6FDB', true, MS_T_CHANS.map(c=>[c[0],c[1]]), cutoff, msTC, msTL),
    ms:   buildKsubEntity('MS팀','#2A6FDB', false, MS_ALL_CHANS.map(c=>[c[0],c[1]]), cutoff, msC, msL),
    it:   buildKsubEntity('I팀','#1F8A5B', false, ORG_CELLMAP.it.chans.map(c=>[c[0],c[1]]), cutoff, itC, itL),
  };

  // 1년 흐름(yearLine) 차트 — 올해 1월 이전(전년 8~12월) 구간은 전년 비교 시트의 월별값을 씀
  window.__DASH_LEGACY__ = { bo:boL, bd:bdL, kp:kpL };
  window.__DASH_CUTOFF__ = cutoff;
}

/* ---------- 1년 선그래프용 — 전년(주별 실측 없음) 구간은 월별 값을 주 단위로 배분한 파생값 ---------- */
const WEEKMAP = [
  ['08',33,35], ['09',36,39], ['10',40,44], ['11',45,48], ['12',49,52]
];
function legacyMonthVal(key, mm){
  const arr = window.__DASH_LEGACY__ && window.__DASH_LEGACY__[key];
  const rec = arr ? arr.find(r=>r.id===mm) : null;
  return rec ? {s:rec.s, c:rec.c} : null;
}
function buildYear(key){
  const src = D[key];
  const out = [];
  const cutoff = window.__DASH_CUTOFF__;
  const priorYear = cutoff.year-1;
  for(const [mm,a,b] of WEEKMAP){
    const rec = legacyMonthVal(key, +mm);
    const n = b-a+1;
    for(let w=a; w<=b; w++) out.push({ w, yr:priorYear, s: rec? rec.s/n : null, c: rec? rec.c : null, est:true });
  }
  (src.week||[]).forEach(r=>{ const w=+r.id.slice(1);
    out.push({ w, yr:cutoff.year, s:r.s, c:r.c!=null?r.c:null, est:false }); });
  return out;
}
function fullWeeks(eObj){
  const have = {};
  (eObj.week||[]).forEach(r=>{ have[+r.id.slice(1)]=r; });
  const ws = Object.keys(have).map(Number).sort((a,b)=>a-b);
  return ws.map(w=>have[w]);
}

/* 2026-09-09: 주간매출자료 외 5개 카테고리(식육사업본부/계열화사업본부/M본부/새말센터/
   SCM·경영·자금) 탭은 사용자 요청으로 제거 — 그 탭들이 쓰던 PDF 뷰어 관련 코드
   (probePdf/pagePdf/renderPdfInto 등)도 전부 같이 정리했다. 원본은 커밋 96e1168 참고. */
const NAV = [
 {id:'sales', n:'주간매출자료', subs:[{id:'bo',n:'보담'},{id:'bd',n:'백두'},{id:'kp',n:'케이프라이드'}]}
];

/* ══════════════════════ 유틸 ══════════════════════ */
const S = { nav1:'sales', nav2:'bo', mode:'month', ksub:'all', view:'bar', mi:11, wi:33 };
/* 월별 배열은 이제 항상 "전년 1~12월 + 올해 1월~기준월" 형태라, 인덱스 12가 곧 "올해 1월"이다.
   그 앞은 트레일링 계산용 전년 데이터일 뿐 직접 선택(현재 시점)할 수 없게 막는다. */
const MONTH_FLOOR = 12;
const n0=v=>(v==null||!isFinite(v))?'–':Math.round(v).toLocaleString('ko-KR');
const n2=v=>(v==null||!isFinite(v))?'–':v.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(v==null||!isFinite(v))?'–':v.toFixed(1)+'%';
const sum=a=>(a||[]).reduce((x,y)=>x+(y||0),0);
const ach=(t,s)=>t>0?s/t*100:null;
const ACC='#2A6FDB', GRN='#1F8A5B', RED='#D64545';
const isM=()=>S.mode==='month';
const idx=()=>isM()?S.mi:S.wi;
const niceMax=v=>{if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/e*2)/2*e;};
const labOf=r=> r.id.startsWith('W') ? r.id.slice(1)+'주' : MLAB[r.id];

/* 현재 보고 있는 조직 */
function ent(){
  if(S.nav2==='kp' && S.ksub!=='all') return KSUB[S.ksub];
  return D[S.nav2];
}
function rows(){ const e=ent(); return isM()?e.month:e.week; }
function chTarget(e,i){ const a=e.chT&&e.chT[i]; return a? a/(isM()?12:52) : null; }

/* ══════════════════════ 막대 차트 ══════════════════════ */
let CTX = null;
/* 조직별 Y축 상한 — "가장 높은 막대 + 500 느낌"으로 고정, 데이터가 이를 넘어서면 자동으로 다시 계산 */
const YCAP = { bo:3000, bd:6000, kp:5500 };
function niceCap(v){ return Math.ceil((v+500)/100)*100; }

function barChart(rs, chans, prev, e, curIdx){
  const H=LAYOUT.CHART_H;
  /* #11: 전년 비교는 최근 3개 기간만 */
  const last3 = new Set(rs.slice(-3).map(r=>r.id));
  const cmp = prev ? rs.map(r=>r.id).filter(id=>last3.has(id) && prev[id]) : [];
  const mx0 = Math.max(...rs.map(r=>r.s||0), ...cmp.map(id=>prev[id].s));
  /* 선그래프 = 금액. 좌측 축 기준. 매출원가(법인) 또는 대출액(MS팀 특정) */
  const lineKind = e.hasLoan ? 'loan' : (rs.some(r=>r.c!=null) ? 'cost' : null);
  const lineName = lineKind==='loan' ? '대출액' : '매출원가율';
  const line = rs.map(r=> lineKind==='loan' ? (r.loan!=null?r.loan:null)
                        : lineKind==='cost' ? (r.c!=null&&r.s!=null? r.s*r.c/100 : null) : null);
  const ticks=[0,1,2,3,4];
  const cap = (isM() && e.id && YCAP[e.id]) ? YCAP[e.id] : null;
  const mx = (cap && mx0<=cap) ? cap : niceCap(mx0);
  const cols=chans.map(x=>x.c), colsL=chans.map(x=>light(x.c));

  const seg=(vals,tot,cs)=> (!vals||!vals.length||tot<=0)
    ? `<span style="height:100%;background:${CO.grey}"></span>`
    : vals.map((v,i)=> v>0?`<span style="height:${(v/tot*100).toFixed(3)}%;background:${cs[i]}"></span>`:'').reverse().join('');

  const bar=(v,ch,cs,wpx,extra,cls,idx)=>`<div class="bwrap" data-cur="${idx!=null?idx:''}" style="height:${(v/mx*100).toFixed(2)}%;width:${wpx}px;${extra}">
      <b class="blab ${cls}">${n2(v)}</b><div class="stk ${cls}">${seg(ch, sum(ch)||v, cs)}</div></div>`;
  const bw = isPortrait() ? {py:40, curHas:40, curSolo:46} : {py:58, curHas:58, curSolo:62};  /* 세로일 때 막대 폭을 얇게 */
  const bars = rs.map((r,i)=>{
    const has = prev && prev[r.id] && last3.has(r.id);
    const py = has ? bar(prev[r.id].s, prev[r.id].ch, colsL, bw.py, 'grid-column:1;justify-self:end;margin-right:9px', 'py') : '';
    const cur = r.s==null ? '' : bar(r.s, r.ch, cols, has?bw.curHas:bw.curSolo, 'grid-column:2', '', i);
    return `<div class="bcol" style="flex:${has?1.6:1}" onclick="openPop(${i})" title="클릭하면 거래처별 상세">${py}${cur}</div>`;
  }).join('');

  /* 막대 폭이 균일하지 않다(전년비교 3개월은 1.6배 넓음) — 선그래프 점 위치의 "초기값"은 가중치 기준으로
     대략 잡아둔다. 다만 .bars엔 flex gap(고정 px)이 섞여 있어 이 계산만으론 정확히 안 맞을 수 있어서,
     실제 DOM에 그려진 뒤 alignLine()이 각 막대의 실측 위치로 다시 정확히 맞춘다(아래 render() 참고). */
  const n=rs.length;
  const weights = rs.map(r=> (prev && prev[r.id] && last3.has(r.id)) ? 1.6 : 1);
  const totalW = weights.reduce((a,b)=>a+b,0);
  const centers = []; let acc=0;
  for(let i=0;i<n;i++){ centers.push((acc+weights[i]/2)/totalW*100); acc+=weights[i]; }
  const pts = line.map((v,i)=> v==null?null:`${centers[i].toFixed(3)},${(100-v/mx*100).toFixed(3)}`).filter(Boolean).join(' ');
  /* 점 위 라벨: 위치는 금액(v) 기준 그대로, 표시 글자만 원가율(%)로 (대출액 라인은 금액 그대로).
     막대 꼭대기(매출액 라벨)와 선 위 라벨이 겹칠 만큼 가까우면(원가율이 100%에 가까울 때 등)
     원가율 라벨을 선 위가 아니라 아래로 내려서 서로 안 겹치게 한다. */
  const dotLabel = (v,i) => lineKind==='cost' ? pct(rs[i].c) : n2(v);
  const dots = line.map((v,i)=> v==null?'':
    (()=>{
      const barFrac = (rs[i].s||0)/mx, lineFrac = v/mx;
      const below = Math.abs(barFrac - lineFrac) < 0.08;
      return `<div class="dotpt" data-i="${i}" style="position:absolute;left:${centers[i].toFixed(3)}%;top:${(100-v/mx*100).toFixed(3)}%;
      width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
      background:#FF6A00;border:2px solid #fff"></div>
     <div class="dotlab" data-i="${i}" style="left:${centers[i].toFixed(3)}%;top:${(100-v/mx*100).toFixed(3)}%${below?';transform:translate(-50%,30%)':''}">${dotLabel(v,i)}</div>`;
    })()).join('');

  CTX = { rs, chans, prev, e };
  const visibleN = isM() ? 5 : 8;  /* 모바일 세로 기본 노출 개수: 월별=5개(최근달 포함 5개월, 그 중 뒤 3개는 전년비교), 주별=8개 */
  const widthPct = isPortrait() ? Math.round(n/visibleN*100) : 100;  /* 가로(컴퓨터)는 12개 그대로 */
  return `<div class="plot">
    <div class="yax" style="height:${H}px">${ticks.map(i=>`<span>${n0(mx*(4-i)/4)}</span>`).join('')}</div>
    <div class="area"><div class="area-inner" style="width:${widthPct}%"><div class="canvas" style="height:${H}px">
      ${ticks.map(i=>`<div class="gl" style="top:${i/4*100}%"></div>`).join('')}
      <div class="bars">${bars}</div>
      ${lineKind?`<div class="ovl"><svg class="lnsvg" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"
        viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="#FF6A00" stroke-width="2.4"
          vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>${dots}</div>`:''}
    </div>
    <div class="xax">${rs.map((r,i)=>`<div class="${i===(curIdx!=null?curIdx:rs.length-1)?'on':''}" style="flex:${weights[i]}"><b>${labOf(r)}</b>
      ${prev&&prev[r.id]&&last3.has(r.id)?`<u>전년비 ${pct(r.s/prev[r.id].s*100)}</u>`:''}</div>`).join('')}</div>
    </div></div>
  </div>
  <div class="lgd">
    ${chans.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('')}
    ${lineKind?`<span><i class="ln" style="border-color:#FF6A00"></i>${lineName}</span>`:''}
  </div>`;
}

/* ══════════════════════ 막대 차트 (모바일 전용 · 가로 막대를 세로로 나열) ══════════════════════
   컴퓨터용 barChart()는 그대로 두고, 모바일에서만 이 함수를 대신 쓴다. 가로 스크롤 없이
   한 화면 폭 안에 값이 다 들어오도록, 항목을 세로로 쌓고 막대는 가로로 눕힌다. */
function barChartMobile(rs, chans, prev, e, curIdx){
  const last3 = new Set(rs.slice(-3).map(r=>r.id));
  const cmp = prev ? rs.map(r=>r.id).filter(id=>last3.has(id) && prev[id]) : [];
  const mx0 = Math.max(...rs.map(r=>r.s||0), ...cmp.map(id=>prev[id].s));
  const cap = (isM() && e.id && YCAP[e.id]) ? YCAP[e.id] : null;
  const mx = (cap && mx0<=cap) ? cap : niceCap(mx0);
  const lineKind = e.hasLoan ? 'loan' : (rs.some(r=>r.c!=null) ? 'cost' : null);
  const cols=chans.map(x=>x.c), colsL=chans.map(x=>light(x.c));

  const seg=(vals,tot,cs)=> (!vals||!vals.length||tot<=0)
    ? `<span style="width:100%;background:${CO.grey}"></span>`
    : vals.map((v,i)=> v>0?`<span style="width:${(v/tot*100).toFixed(3)}%;background:${cs[i]}"></span>`:'').join('');

  CTX = { rs, chans, prev, e };
  const rows = rs.map((r,i)=>{
    if(r.s==null) return '';
    const has = prev && prev[r.id] && last3.has(r.id);
    const wPct = (r.s/mx*100).toFixed(2);
    const py = has ? `<div class="hbar-py" style="width:${(prev[r.id].s/mx*100).toFixed(2)}%">${seg(prev[r.id].ch, sum(prev[r.id].ch)||prev[r.id].s, colsL)}</div>` : '';
    const yoy = has ? `<span class="hbar-yoy">전년비 ${pct(r.s/prev[r.id].s*100)}</span>` : '';
    const costLine = lineKind==='loan' ? `<span class="hbar-cost">대출액 ${n2(r.loan)}</span>`
                  : lineKind==='cost' && r.c!=null ? `<span class="hbar-cost">원가율 ${pct(r.c)}</span>` : '';
    return `<div class="hbar-row${i===curIdx?' on':''}" onclick="openPop(${i})">
      <div class="hbar-head"><span class="hbar-lbl">${labOf(r)}</span>${costLine}${yoy}</div>
      <div class="hbar-track-wrap">
        <div class="hbar-track" style="width:${wPct}%">${seg(r.ch, sum(r.ch)||r.s, cols)}</div>
        <span class="hbar-track-val">${n2(r.s)}</span>
      </div>
      ${py}
    </div>`;
  }).join('');

  return `<div class="hbars">${rows}</div>
  <div class="lgd">
    ${chans.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('')}
    ${prev?'<span><i style="border:1px dashed #a8b0bb;background:transparent"></i>전년(같은 기간)</span>':''}
  </div>`;
}

/* ══════════════════════ 1년 선 그래프 ══════════════════════ */
function yearLine(key, color){
  const ys = buildYear(key).filter(r=>r.s!=null);
  const H=LAYOUT.CHART_H, n=ys.length;
  const mx = niceMax(Math.max(...ys.map(r=>r.s))*1.12);
  const cv = ys.map(r=>r.c).filter(v=>v!=null);
  const hasCost = cv.length>0;
  const ticks=[0,1,2,3,4];
  const p1 = ys.map((r,i)=>`${(i/(n-1)*100).toFixed(3)},${(100-r.s/mx*100).toFixed(3)}`).join(' ');
  const p2 = hasCost ? ys.map((r,i)=> r.c==null?null
      :`${(i/(n-1)*100).toFixed(3)},${(100-(r.s*r.c/100)/mx*100).toFixed(3)}`).filter(Boolean).join(' ') : '';
  /* 매주 눈금, 라벨은 9주 간격 + 마지막 주 */
  const show = i => i%9===0 || i===n-1;
  const marks = ys.map((r,i)=>{
    const x=(i/(n-1)*100).toFixed(3);
    return `<div style="position:absolute;left:${x}%;top:0;width:1px;height:${show(i)?7:4}px;
        background:${show(i)?'#c9d0da':'#e7eaef'}"></div>` +
      (show(i)?`<div style="position:absolute;left:${x}%;top:10px;transform:translateX(-50%);
        font-size:10.5px;color:#9aa3af;font-weight:600;white-space:nowrap">${r.yr}년 ${r.w}주</div>`:'');
  }).join('');
  const visibleN = 15;  /* 모바일에서 한 화면에 보이는 주 수 — 나머지는 좌우로 스크롤해서 본다 */
  const widthPct = isPortrait() ? Math.round(n/visibleN*100) : 100;
  return `<div class="plot">
    <div class="yax" style="height:${H}px">${ticks.map(i=>`<span>${n0(mx*(4-i)/4)}</span>`).join('')}</div>
    <div class="area"><div class="area-inner" style="width:${widthPct}%"><div class="canvas" style="height:${H}px">
      ${ticks.map(i=>`<div class="gl" style="top:${i/4*100}%"></div>`).join('')}
      <svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"
        viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline points="${p1}" fill="none" stroke="${color}" stroke-width="2.2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
        ${hasCost?`<polyline points="${p2}" fill="none" stroke="#C8842A" stroke-width="1.8"
          vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-dasharray="5 4"></polyline>`:''}</svg>
      ${ys.map((r,i)=>`<div title="${r.yr}년 ${r.w}주 · 매출 ${n2(r.s)}${r.c!=null?' · 매출원가 '+n2(r.s*r.c/100):''}"
        style="position:absolute;left:${(i/(n-1)*100).toFixed(3)}%;top:0;bottom:0;width:${(100/n).toFixed(2)}%;
        transform:translateX(-50%)"></div>`).join('')}
    </div><div style="position:relative;height:26px;margin-top:8px">${marks}</div></div></div>
  </div>
  <div class="lgd"><span><i class="ln" style="border-color:${color}"></i>매출액</span>
    ${hasCost?`<span><i class="ln" style="border-color:#C8842A"></i>매출원가</span>`:''}</div>`;
}

/* ══════════════════════ 팝업 ══════════════════════ */
/* KSUB 팀(MS팀 특정/MS팀/I팀)은 별도 prev 객체가 없고, month 배열 안에 2025년 항목이 같이 들어있다.
   같은 시트(예: 2025년-케이MS특정=S팀)에서 뽑은 전년 동월 값을 그 배열 안에서 직접 찾는다. */
function findPriorYear(e, r){
  if(!r.id.startsWith('20')) return null;   // 주별(W..)은 전년 대응값 없음
  const [y,m] = r.id.split('-');
  const pid = (parseInt(y,10)-1)+'-'+m;
  const arr = e.month || [];
  return arr.find(x=>x.id===pid) || null;
}

function openPop(i){
  if(!CTX) return;
  const {rs,chans,prev,e} = CTX, r = rs[i];
  if(!r || r.s==null) return;
  const vals = r.ch || null;
  const mxv = vals ? Math.max(...vals) : r.s;
  const py = (prev && prev[r.id]) || findPriorYear(e, r);
  const a = ach(r.t, r.s);

  /* #19/#20: 조직 종류별 상세 요약 줄 */
  let summary;
  if(e.hasLoan){
    const mg = r.s>0 && r.loan!=null ? (r.s-r.loan)/r.s*100 : null;
    summary = `매출액 ${n2(r.s)} · 대출액 ${n2(r.loan)} · 대익율 ${pct(mg)} · 목표 달성율 ${pct(a)}`;
  } else if(r.c!=null){
    summary = `매출액 ${n2(r.s)} · 목표 달성율 ${pct(a)} · 매출원가율 ${pct(r.c)}`;
  } else {
    summary = `매출액 ${n2(r.s)} · 목표 달성율 ${pct(a)}`;
  }
  if(py) summary += ` (전년 매출액 ${n2(py.s)})`;

  const body = vals ? chans.map((c,j)=>{
      return `<div class="mrow">
        <div class="nm"><i style="background:${c.c}"></i><span>${c.n}</span></div>
        <div class="mtrack"><i style="width:${mxv>0?(vals[j]/mxv*100).toFixed(2):0}%;background:${c.c}"></i></div>
        <div class="mval"><b>${n2(vals[j])}</b><u>${r.s>0?pct(vals[j]/r.s*100):'–'}</u></div>
      </div>`;}).join('')
    : `<div class="mrow"><div class="nm"><i style="background:${CO.grey}"></i><span>미집계</span></div>
        <div class="mtrack"><i style="width:100%;background:${CO.grey}"></i></div>
        <div class="mval"><b>${n2(r.s)}</b><u>거래처 상세 준비 중</u></div></div>`;
  document.getElementById('pop').innerHTML = `<div class="mask" onclick="closePop(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="mhd"><div><h3>${e.name} · ${labOf(r)} 거래처별 매출</h3>
        <div class="tot">${summary}</div></div>
        <button class="x" onclick="closePop()">×</button></div>
      <div style="padding:12px 0">${body}</div>
      <div class="mft"></div></div></div>`;
}
function closePop(ev){ if(ev && ev.target && !ev.target.classList.contains('mask')) return;
  document.getElementById('pop').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePop(); });

/* ══════════════════════ 표 ══════════════════════ */
function table(rs, chans, prev, e, curId, title, toggle){
  const showCost = !e.hasLoan && rs.some(r=>r.c!=null);
  const showLoan = !!e.hasLoan;
  const base = 4 + (showCost?1:0) + (showLoan?2:0);
  const head = `<tr>
    <th rowspan="2">구분</th><th rowspan="2">목표</th><th rowspan="2">매출액</th><th rowspan="2">달성율</th>
    ${showCost?'<th rowspan="2">매출원가율</th>':''}
    ${showLoan?'<th rowspan="2">대출액</th><th rowspan="2">대익률</th>':''}
    ${chans.map(x=>`<th class="g sep" colspan="3" style="color:${x.c}">${x.n}</th>`).join('')}</tr>
    <tr>${chans.map(()=>`<th class="r2 sep">목표</th><th class="r2">매출</th><th class="r2">달성율</th>`).join('')}</tr>`;

  const cells = r => chans.map((c,j)=>{
    const t = chTarget(e,j), v = r.ch?r.ch[j]:null;
    return `<td class="sep mut">${t?n0(t):'–'}</td><td>${v!=null?n2(v):'–'}</td>
            <td>${t&&v!=null?pct(ach(t,v)):'–'}</td>`;}).join('');

  let body = rs.map(r=>{
    const mg = showLoan && r.s>0 && r.loan!=null ? (r.s-r.loan)/r.s*100 : null;
    const isEst = r.est===true;
    return `<tr class="${r.id===curId?'cur':''}${isEst?' est':''}"><td>${labOf(r)}${isEst?'*':''}</td>
      <td class="mut">${n0(r.t)}</td><td class="sale">${n2(r.s)}</td><td>${pct(ach(r.t,r.s))}</td>
      ${showCost?`<td class="${r.c>=100?'hot':(r.c<70?'cool':'')}">${pct(r.c)}</td>`:''}
      ${showLoan?`<td class="mut">${n2(r.loan)}</td><td>${pct(mg)}</td>`:''}
      ${cells(r)}</tr>`;}).join('');

  const T=sum(rs.map(r=>r.t)), Sm=sum(rs.map(r=>r.s)), L=sum(rs.map(r=>r.loan));
  body += `<tr class="tot"><td>합계</td><td>${n0(T)}</td><td class="sale">${n2(Sm)}</td><td>${pct(ach(T,Sm))}</td>
    ${showCost?'<td>–</td>':''}
    ${showLoan?`<td>${n2(L)}</td><td>${pct(Sm>0?(Sm-L)/Sm*100:null)}</td>`:''}
    ${chans.map((c,j)=>{const t=e.chT?e.chT[j]/(isM()?1:52/12):null, v=sum(rs.map(r=>r.ch?r.ch[j]:0));
      return `<td class="sep">${t?n0(t):'–'}</td><td>${n2(v)}</td><td>${t?pct(ach(t,v)):'–'}</td>`;}).join('')}</tr>`;

  const p = prev && prev[curId];
  if(p){
    const colspan = 4 + (showCost?1:0) + (showLoan?2:0) + chans.length*3;
    body += `<tr class="spacer"><td colspan="${colspan}"></td></tr>`;
    body += `<tr class="py"><td>전년 ${labOf({id:curId})}</td><td>${n0(p.t)}</td>
    <td class="sale">${n2(p.s)}</td><td>${pct(ach(p.t,p.s))}</td>
    ${showCost?`<td>${pct(p.c)}</td>`:''}${showLoan?'<td>–</td><td>–</td>':''}
    ${chans.map((c,j)=>`<td class="sep">–</td><td>${p.ch?n2(p.ch[j]):'–'}</td><td>–</td>`).join('')}</tr>`;
  }

  return `<div class="card tcard"><div class="chd"><h2>${title||''}</h2>${toggle||''}</div><div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
}

/* ══════════════════════ KPI ══════════════════════ */
function kbar(rs, e, ci){
  const cur=rs[ci], pr=rs[ci-1];
  const a=ach(cur.t,cur.s), pa=pr?ach(pr.t,pr.s):null;
  const UP='#2A6FDB', DN='#D64545';
  /* 퍼센트포인트 증감 표기 */
  const dp=(c,p,note)=>{
    if(c==null||p==null||!isFinite(c)||!isFinite(p)) return note||'&nbsp;';
    const v = c-p;
    if(!isFinite(v)) return note||'&nbsp;';
    const up=v>=0;
    return `전${isM()?'월':'주'} 대비 <b style="color:${Math.abs(v)<.05?'#a8b0bb':(up?UP:DN)}">
      ${up?'+':''}${v.toFixed(1)}%p ${up?'▲':'▼'}</b>${note?'<span class="d-sep"> · </span><span class="d-note">'+note+'</span>':''}`;
  };
  /* 금액 증감 표기 (매출액 전용) */
  const damt=(c,p)=>{
    if(c==null||p==null||!isFinite(c)||!isFinite(p)) return '&nbsp;';
    const v = c-p;
    const up=v>=0;
    return `전${isM()?'월':'주'} 대비 <b style="color:${Math.abs(v)<.005?'#a8b0bb':(up?UP:DN)}">
      ${up?'+':''}${n2(v)} ${up?'▲':'▼'}</b>`;
  };
  const cell=(l,v,dd)=>`<div class="card kc"><div class="l">${l}</div>
    <div class="v">${v}</div><div class="d">${dd}</div></div>`;

  const c1 = cell(isM()?'월간 매출액':'주간 매출액', `${n2(cur.s)}<small> 백만</small>`, damt(cur.s, pr?pr.s:null));
  const c3 = cell('목표달성율', `${a!=null?a.toFixed(1):'–'}<small>%</small>`, dp(a,pa,`목표 ${n2(cur.t)}`));

  /* 2026년 총 매출액 - month 배열 안에서 '2026-'로 시작하는 실측월을 전부 합산(월별/주별 모드와 무관한 연간 누계) */
  const y26 = (e.month||[]).filter(r=>r.id.startsWith('2026'));
  const y26s = sum(y26.map(r=>r.s)), y26t = sum(y26.map(r=>r.t));
  const cYear = cell('2026년 총 매출액', `${n2(y26s)}<small> 백만</small>`,
    `목표 대비 <b>${pct(ach(y26t,y26s))}</b>`);

  /* MS팀 특정/MS팀/I팀(KSUB)은 매출액·목표달성율·연간누계 3개만 — 대익률/매출원가율/누계매출 칸은 넣지 않는다 */
  if(!e.id) return `<div class="kbar g3">${cYear}${c1}${c3}</div>`;

  const c2 = e.hasLoan
    ? (()=>{ const m=cur.s>0?(cur.s-cur.loan)/cur.s*100:null,
                   pm=pr&&pr.s>0?(pr.s-pr.loan)/pr.s*100:null;
        return cell('대익률', `${m!=null?m.toFixed(1):'–'}<small>%</small>`,
          dp(m,pm,`대출 ${n2(cur.loan)}`)); })()
    : (cur.c!=null
        ? cell('매출원가율', `${cur.c.toFixed(1)}<small>%</small>`, dp(cur.c, pr?pr.c:null))
        : cell('누계 매출', `${n2(sum(rs.slice(0,ci+1).map(r=>r.s)))}<small> 백만</small>`,
            `목표 대비 <b>${pct(ach(sum(rs.slice(0,ci+1).map(r=>r.t)),sum(rs.slice(0,ci+1).map(r=>r.s))))}</b>`));
  return `<div class="kbar g4">${cYear}${c1}${c2}${c3}</div>`;
}

/* ══════════════════════ 렌더 ══════════════════════ */
/* KSUB 팀(MS팀 특정/MS팀/I팀)은 별도 prevM 객체가 없고, month 배열 안에 2025년 항목이 같이 들어있다.
   이걸 D.xx.prevM과 같은 모양({ '2026-08':{s,t,c,ch,...} })으로 변환해서 표/차트에 그대로 재사용한다. */
function buildKsubPrev(e){
  const out = {};
  (e.month||[]).forEach(r=>{
    if(!r.id.startsWith('20')) return;
    const [y,m] = r.id.split('-');
    if(+y>=2026) return;
    out[(+y+1)+'-'+m] = r;
  });
  return out;
}

function pageSales(){
  const e = ent(), allRs = rows();
  /* 최근 12개만 보여주되, 선택된 시점(과거로 이동한 경우 포함)이 항상 창의 마지막
     칸에 오도록 "선택 지점 기준" 창을 슬라이드한다. 예전엔 항상 "전체의 마지막 12개"로
     고정해서, 12개 창 밖의(더 과거) 주차를 선택하면 찾지 못해(ci<0) 최신 주차로
     조용히 되돌아가 버렸다 — 표/요약바가 선택과 무관하게 최신 주차에 멈춰 보이던 버그의 원인.
     전주(pr=rs[ci-1]) 비교도 이 창 안에 실제 이전 시점이 들어와야 정상 표시된다. */
  const navFloor = isM() ? MONTH_FLOOR : 0;
  const globalIdx = Math.min(Math.max(idx(), navFloor), allRs.length-1);
  /* 창의 시작점(왼쪽 끝)은 navFloor로 자르지 않는다 — 월별에서 선택 가능한 "현재 시점"은
     올해 1월 이전으로 못 가지만, 그 시점의 트레일링 12개월 창 자체는 작년 데이터까지
     정상적으로 보여줘야 한다(예: 올해 1월 선택 시 작년 2월~올해 1월 12개가 나와야 함). */
  const rs = allRs.slice(Math.max(0, globalIdx-11), globalIdx+1);
  const selId = allRs[globalIdx].id;
  let ci = rs.findIndex(r=>r.id===selId);
  if(ci<0) ci = rs.length-1;
  const safeCI = ci;
  const isKsub = S.nav2==='kp' && S.ksub!=='all';
  const prev = isKsub ? (isM()?buildKsubPrev(e):null) : (isM()?D[S.nav2].prevM:D[S.nav2].prevW);
  const chartKey = (S.nav2==='kp' && S.ksub!=='all') ? S.ksub : S.nav2;
  const view = (isM() && S.view==='line') ? 'bar' : S.view;  /* 월별엔 라인 뷰가 없음 - 안전장치 */

  const kbarHtml = kbar(rs, e, ci);
  const viewToggle = `<div class="seg sm">${(isM()?[['bar','막대'],['table','표']]:[['bar','막대'],['line','라인'],['table','표']])
      .map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="setView('${x[0]}')">${x[1]}</button>`).join('')}</div>`;

  let bodyHtml;
  if(view==='table'){
    bodyHtml = table(isM()?rs:fullWeeks(e), e.chans, prev, e, ci>=0?rs[ci].id:rs[rs.length-1].id, `${e.name} ${isM()?'월별':'주별'} 표`, viewToggle);
  } else if(view==='line'){
    bodyHtml = `<div class="card chart">
      <div class="chd"><h2>${e.name} 1년 흐름</h2>${viewToggle}</div>
      ${yearLine(chartKey, e.color)}
    </div>`;
  } else {
    /* 모바일(세로)에서는 가로 스크롤 막대 대신, 세로로 쌓인 가로 막대 리스트를 쓴다. */
    const chartHtml = isPortrait() ? barChartMobile(rs, e.chans, prev, e, safeCI) : barChart(rs, e.chans, prev, e, safeCI);
    bodyHtml = `<div class="card chart">
      <div class="chd"><h2>${e.name} ${isM()?'월별':'주별'}</h2>${viewToggle}</div>
      ${chartHtml}
    </div>`;
  }
  return { kbarHtml, bodyHtml };
}

function render(){
  /* 세로(모바일)/가로 여부에 맞는 카드·캔버스 높이를 먼저 확정해 둔다 — 이 값이 아래
     pageSales()의 barChart/table에서 인라인 px로 그대로 쓰이므로, HTML을 만들기 전인
     지금 반드시 먼저 계산해야 한다. */
  recalcCardLayout(isPortrait());
  const g = NAV.find(x=>x.id===S.nav1);
  if(g.subs.length && !g.subs.some(x=>x.id===S.nav2)) S.nav2 = g.subs[0].id;
  const e = ent();
  const rs = rows();
  const navFloor = isM() ? MONTH_FLOOR : 0;
  const i = Math.min(Math.max(idx(), navFloor), rs.length-1);
  const r = rs[i];
  const big = isM() ? `${r.id.slice(0,4)}년 ${+r.id.slice(5)}월` : `2026년 ${r.id.slice(1)}주차`;

  const page = pageSales();

  document.getElementById('stage').innerHTML = `
  <div class="fixed-zone">
  <div class="top">
    <div class="brand"><div class="bar" style="background:${e.color}"></div>
      <h1>${g.n}</h1>
      <span class="unit">(단위:백만 원)</span></div>
    <div class="stepper">
      <button onclick="step(-1)" ${i<=navFloor?'disabled':''}>‹</button>
      <div class="lbl">${big}</div>
      <button onclick="step(1)" ${i>=rs.length-1?'disabled':''}>›</button></div>
  </div>
  <!-- 2026-09-09: 보담/백두/케이프라이드는 이제 최상단 카테고리 위치(원래 5개
       카테고리 탭이 있던 자리)에 온다. 케이프라이드 선택 시에만 존재하는
       전사/MS팀 특정/MS팀/I팀 소분류는 그 대신 이 줄(navrow) 좌측에 놓는다. -->
  <div class="nav1">${g.subs.map(x=>{
     const col = D[x.id].color;
     return `<button class="${S.nav2===x.id?'on':''}" onclick="go2('${x.id}')"
       style="${S.nav2===x.id?`background:${col};border-color:${col}`:''}">
       <span class="pip" style="background:${S.nav2===x.id?'#fff':col}"></span>${x.n}</button>`;}).join('')}</div>
  <div class="navrow">
    ${S.nav2==='kp'?`<div class="seg sm">${[['all','전사'],['ms_t','MS팀 특정'],['ms','MS팀'],['it','I팀']]
        .map(x=>`<button class="${S.ksub===x[0]?'on':''}" onclick="setKsub('${x[0]}')">${x[1]}</button>`).join('')}</div>`:''}
    <div class="spacer"></div>
      <div class="seg"><button class="${isM()?'on':''}" onclick="setMode('month')">월별</button>
        <button class="${!isM()?'on':''}" onclick="setMode('week')">주별</button></div>
  </div>
  ${page.kbarHtml}
  </div>
  ${page.bodyHtml}`;
  fit();
  /* 표는 최근 구간(6개월/6주)이 먼저 보이도록 표 내부 스크롤은 맨 아래로, 헤더는 sticky로 고정 */
  const twEl = document.querySelector('.tw');
  if(twEl) twEl.scrollTop = twEl.scrollHeight;
  /* 막대그래프도 처음엔 가장 최근(오른쪽 끝)이 보이도록 */
  const areaEl = document.querySelector('.area');
  if(areaEl) areaEl.scrollLeft = areaEl.scrollWidth;
  alignLine();
}
/* 무대를 화면에 맞춰 축소 */
/* 가로 볼 때는 기존 339:191 그대로. 세로(모바일 세로)일 때만 기기별(아이폰/갤럭시) 화면비로 --H를 바꾼다.
   너비(--W=1920)는 항상 그대로 두고, 세로에서 --H만 그 비율에 맞게 늘려서 계산한다. */
/* "화면이 세로로 길쭉한가"만 보면 컴퓨터에서 창을 좁게/세로로 만든 경우까지 모바일로 오인한다.
   그래서 "실제 모바일 기기인지"까지 같이 확인한다 — 컴퓨터는 창 모양이 어떻든 이 조건에 절대 안 걸린다. */
const IS_MOBILE_DEVICE = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
/* fit()이 render() "이후"에 실행되므로, render() 도중(barChart 등)에도 즉시 같은 기준으로 판정할 수 있도록 별도 함수로 뺀다 */
function isPortrait(){ return IS_MOBILE_DEVICE && window.innerWidth < window.innerHeight; }
/* 선그래프(원가율/대출액) 점·점라벨·꺾은선을 "실제로 그려진 올해 막대"의 픽셀 중심에 다시 맞춘다.
   .bars엔 flex gap(고정 px)이 섞여 있어서 %만으로 계산하면 오차가 누적된다 — 실측이 가장 정확하다. */
function alignLine(){
  const svg = document.querySelector('.lnsvg'); if(!svg) return;
  const canvas = svg.closest('.canvas'); if(!canvas) return;
  const cvRect = canvas.getBoundingClientRect();
  if(cvRect.width<=0) return;
  const poly = svg.querySelector('polyline');
  const pts = [];
  document.querySelectorAll('.dotpt[data-i]').forEach(dot=>{
    const i = dot.getAttribute('data-i');
    const bar = canvas.querySelector(`.bwrap[data-cur="${i}"]`);
    if(!bar) return;
    const bRect = bar.getBoundingClientRect();
    const xPct = ((bRect.left + bRect.width/2) - cvRect.left) / cvRect.width * 100;
    dot.style.left = xPct.toFixed(3)+'%';
    const lab = document.querySelector(`.dotlab[data-i="${i}"]`);
    if(lab) lab.style.left = xPct.toFixed(3)+'%';
    pts.push([+i, xPct, dot.style.top]);
  });
  if(poly && pts.length){
    pts.sort((a,b)=>a[0]-b[0]);
    poly.setAttribute('points', pts.map(p=>`${p[1].toFixed(3)},${parseFloat(p[2]).toFixed(3)}`).join(' '));
  }
}
/* 모바일(세로): 축소 없이 실제 화면 폭 그대로, 세로로 자연스럽게 스크롤되는 레이아웃.
   데스크탑(가로): 기존 그대로 1920×1082 무대를 화면에 맞게 축소해서 보여준다. */
function fit(){
  const st=document.getElementById('stage'); if(!st) return;
  const vp=document.getElementById('viewport');
  const portrait = isPortrait();
  document.documentElement.classList.toggle('mob', portrait);
  document.body.classList.toggle('mob', portrait);
  vp.classList.toggle('mob', portrait);
  st.classList.toggle('portrait', portrait);
  recalcCardLayout(portrait);
  if(portrait){
    st.style.transform='none';
    return;
  }
  applyLayout();
  const W = LAYOUT.STAGE_W, H = LAYOUT.STAGE_H;
  document.documentElement.style.setProperty('--W', W+'px');
  document.documentElement.style.setProperty('--H', H+'px');
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  st.style.transform='scale('+s+')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
/* 2026-09-07: 웹폰트(Pretendard, CDN)나 로고 이미지가 초기 렌더 이후 늦게 로드되면, 그
   위쪽 고정 영역의 실제 높이가 바뀌면서 카드/캔버스가 쓸 수 있는 세로 공간도 따라 바뀐다 —
   그런데 이건 창 크기가 바뀐 게 아니라서 resize 이벤트가 안 뜬다. 폰트 로딩 완료
   (document.fonts.ready)와 전체 리소스 로딩 완료(load) 시점에도 한 번 더 fit()을 불러
   그 순간의 실제 크기로 다시 맞춘다. */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit).catch(()=>{});
window.addEventListener('load', fit);
/* 2026-09-09: 주간매출자료 외 카테고리 탭을 없애면서 NAV엔 이제 'sales' 하나뿐이라
   go1()이 사실상 항상 같은 곳으로 돌아가지만, 탭 구조 자체는 남겨뒀다(추후 카테고리가
   다시 필요해질 수 있어서) — 그래서 go1/go2도 원래 형태를 최대한 유지했다. */
function go1(v){ S.nav1=v; const g=NAV.find(x=>x.id===v); S.nav2=g.subs.length?g.subs[0].id:'';
  resetToLatest(); closePop(); render(); }
/* 조직마다 월별 배열 길이가 달라서(D류=12개월, KSUB류=20개월), 조직을 바꿀 때마다
   항상 "가장 최근 시점"으로 인덱스를 다시 맞춘다. */
function resetToLatest(){
  const e = ent();
  S.mi = (e.month||[]).length - 1;
  S.wi = (e.week||[]).length - 1;
}
function go2(v){ S.nav2=v; S.ksub='all';
  resetToLatest();
  closePop(); render(); }
function setMode(v){ S.mode=v; if(v==='month' && S.view==='line') S.view='bar'; closePop(); render(); }
function setKsub(v){ S.ksub=v; resetToLatest(); closePop(); render(); }
function setView(v){ S.view=v; closePop(); render(); }
function step(d){ const all = rows();
  /* 월별은 "올해 1월"(MONTH_FLOOR, 배열의 12번째)보다 더 과거로는 선택 못 하게 막는다 —
     그 앞(인덱스 0~11)은 트레일링 12개월 계산에만 쓰는 전년 데이터라 직접 선택 대상이 아님. */
  const floor = isM() ? MONTH_FLOOR : 0;
  const v=idx()+d; if(v<floor||v>=all.length) return; if(isM()) S.mi=v; else S.wi=v; closePop(); render(); }

/* ══════════════════════ 부트스트랩 — xlsm 로드 후 첫 렌더 ══════════════════════ */
(async function start(){
  const stage = document.getElementById('stage');
  stage.innerHTML = '<div class="drop"><h3>불러오는 중…</h3><p>주간매출자료 xlsm 파일을 확인하고 있습니다.</p></div>';
  try{
    await bootstrapData();
    /* 월별 배열 길이가 조직마다 다르고(이제 전년 12개월 + 올해 N개월), 초기값(S.mi=11)은
       예전(항상 12개 고정 길이) 기준이라 지금은 최신월을 안 가리킬 수 있다 — 실제 데이터
       기준으로 다시 맞춘다. */
    resetToLatest();
    render();
  }catch(err){
    console.error('[대시보드] 불러오기 실패:', err);
    stage.innerHTML = '<div class="drop"><h3>불러오기 실패</h3><p>' +
      String((err&&err.message)||err).replace(/</g,'&lt;') + '</p></div>';
  }
})();
</script>
